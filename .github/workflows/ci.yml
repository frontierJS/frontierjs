# ============================================================
# CI — a thin wrapper around scripts/ci.mjs
#
# Everything this file decides is environmental: a fresh clone, a bun, a node,
# a Chrome. Every CHECK lives in scripts/ci.mjs, so moving off GitHub costs a
# delete and the same run happens on a laptop with `bun run ci`.
#
# Do not add a check here. A check that only exists in YAML cannot be run by
# the person who has to fix it.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells nobody anything.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # The typecheck ratchet compares against the merge base, which needs
          # real history — a shallow clone has no merge base to find.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # packages/frontierjs-vscode is the one package that runs on npm — its own
      # scripts shell out to `npm run build`, and `scripts/ci.mjs` is plain node.
      #
      # 24 is the ACTIVE LTS and is the floor `create-frontier` and `jetty`
      # declare. Testing above the floor leaves the version users actually
      # install untested, which is the direction that matters here: `npm create
      # frontier` runs on a stranger's node, not on this runner's.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # packages/css drives a real headless Chrome and sierra's island
      # verification does too. The runner image ships one; naming it here means
      # a missing browser fails as a missing browser rather than as a css bug.
      - name: Locate Chrome
        run: |
          which google-chrome || which chromium || {
            echo "::error::No Chrome on the runner — packages/css cannot run"
            exit 1
          }
          echo "FJS_CHROME=$(which google-chrome || which chromium)" >> "$GITHUB_ENV"

      # --frozen-lockfile, which is what a clean checkout should want: a
      # lockfile that does not match package.json is exactly the difference
      # between one machine and everyone else's. It could not be used until
      # FJS-157 — bun re-resolved sierra's and jetty's `@frontierjs/mesa` peer
      # on every install and wrote a nested tree the previous install had not,
      # so frozen mode failed on a lockfile bun itself had just written.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        env:
          # A raised typecheck baseline is measured against where this branch
          # left the base, not against the base's tip.
          FJS_CI_BASE_REF: origin/${{ github.base_ref || 'main' }}
          # ubuntu-latest ships a Docker daemon, so the deploy phase has no
          # excuse here. Locally a missing daemon is a named note; on the runner
          # a skipped phase is a failure, because a check that quietly stops
          # running is worse than one that was never written.
          FJS_CI_REQUIRE_DOCKER: '1'
        run: node scripts/ci.mjs
