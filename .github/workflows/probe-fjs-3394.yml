# ============================================================
# Probe for FJS-3394 — run by hand, never on a push.
#
# packages/cli/test/dockerfile-flag-path.test.js builds one context twice,
# from the app root and by an absolute -f from elsewhere, and expects one
# image id. On this runner's BuildKit the two ids differ and no laptop
# reproduces it, so this prints what an id is made of — the config, its
# timestamps, the layer digests — for both builds, side by side.
# ============================================================

name: probe-fjs-3394

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Versions
        run: |
          docker version
          docker buildx version || true
          docker info 2>/dev/null | grep -i -E 'builder|buildkit|storage driver|server version' || true

      - name: Build twice, as the test does
        run: |
          set -x
          root=$(mktemp -d /tmp/fli-dockerfile-flag-XXXXXX)
          app=$root/app; elsewhere=$root/elsewhere
          mkdir -p $app/deploy $elsewhere
          printf 'FROM busybox\nCOPY marker /marker\n' > $app/deploy/Dockerfile
          printf 'hi\n' > $app/marker
          cd $app;       docker build -q -t fli-dff-root:$$ -f deploy/Dockerfile $app        | tee /tmp/id-root
          cd $elsewhere; docker build -q -t fli-dff-abs:$$  -f $app/deploy/Dockerfile $app   | tee /tmp/id-abs
          echo "root=$(cat /tmp/id-root) abs=$(cat /tmp/id-abs)"

      - name: What differs
        run: |
          for t in root abs; do
            echo "=== $t: $(cat /tmp/id-$t) ==="
            docker image inspect $(cat /tmp/id-$t) --format '{{json .}}' | python3 -c '
          import json,sys; i=json.load(sys.stdin)
          print("Created:", i.get("Created")); print("RootFS:", i["RootFS"]); print("Config.Labels:", i["Config"].get("Labels")); print("Os/Arch:", i.get("Os"), i.get("Architecture"))'
            docker history --no-trunc --format '{{.ID}} | {{.CreatedAt}} | {{.CreatedBy}} | {{.Comment}}' $(cat /tmp/id-$t)
          done
          echo "=== full configs, diffed ==="
          docker image inspect $(cat /tmp/id-root) > /tmp/root.json
          docker image inspect $(cat /tmp/id-abs)  > /tmp/abs.json
          diff <(python3 -m json.tool /tmp/root.json) <(python3 -m json.tool /tmp/abs.json) || true
