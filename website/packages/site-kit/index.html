<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>site-kit</title>
<!--
  The DEV shell of every site-kit site, served by config/shell.js. A built page
  never uses this file: target 'static' prerenders every route into its own
  HTML wrapped in Sierra's `document` block, home page included.

  Do not write a literal body tag in this comment. Vite injects the built script
  and stylesheet at the first textual match for it and does not skip comments.

  No theme class on the body: Sierra writes it to the html element, and one
  here re-declares every theme token below it, so the swatches do nothing
  (FJS-501).
-->
<body>
  <div id="app"></div>
  <script type="module" src="/@site-kit/main.js"></script>
</body>
