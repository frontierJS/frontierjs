        if (!html)
          html = '<span style="color:var(--dim);font-size:11px">No reactive variables.</span>'

        document.getElementById('graph-inner').innerHTML = html
        renderGraphFilter(presentLabels)
      }

      // ─── Analysis panel ───────────────────────────────────────────────────────────

      let _analysisData = { script: null, template: null }
      let _activeAtab = 'script'

      function cleanAnalysis(analysis) {
        // Strip noisy acorn AST nodes and source positions — show semantic data only
        const stripNode = (v, depth = 0) => {
          if (depth > 8 || v === null || v === undefined) return v
          if (typeof v !== 'object') return v
          if (Array.isArray(v)) return v.map(i => stripNode(i, depth + 1))
          const out = {}
          for (const [k, val] of Object.entries(v)) {
            // Drop raw acorn AST nodes (they're huge and unreadable)
            if (k === 'initNode' || k === 'type' && val && val.includes && val.includes('Expression')) continue
            // Drop source offsets — not useful for display
            if (k === 'nodeStart' || k === 'nodeEnd') continue
            // Drop internal synthetic markers
            if (k === '_syntheticInit') continue
            out[k] = stripNode(val, depth + 1)
          }
          return out
        }

        return {
          vars: stripNode(analysis.vars),
          watchPaths: stripNode(analysis.watchPaths),
          watchHandlers: stripNode(analysis.watchHandlers),
          watchGroups: stripNode(analysis.watchGroups),
          contextProvides: analysis.contextProvides || [],
          effects: (analysis.effects || []).map(e => ({ type: e.type, raw: e.raw?.trim().slice(0, 80) })),
          reactiveNames: analysis.reactiveNames,
          errors: analysis.errors,
          warnings: analysis.warnings,
        }
      }

      function cleanDOM(dom) {
        const strip = (node, depth = 0) => {
          if (depth > 10 || !node || typeof node !== 'object') return node
          if (Array.isArray(node)) return node.map(n => strip(n, depth + 1)).filter(n =>
            // drop pure whitespace text nodes
            !(n && n.type === 'text' && typeof n.value === 'string' && !n.value.trim())
          )
          const out = {}
          for (const [k, v] of Object.entries(node)) {
            if (k === 'start' || k === 'end' || k === 'elArg' ||
                k === 'closedTag' || k === 'voidTag' || k === 'openTag') continue
            if (typeof v === 'function') continue
            out[k] = strip(v, depth + 1)
          }
          return out
        }
        return strip(dom)
      }

      function jsonToHtml(val, indent = 0) {
        const pad = '  '.repeat(indent)
        const pad1 = '  '.repeat(indent + 1)
        if (val === null) return `<span class="aj-null">null</span>`
        if (val === undefined) return `<span class="aj-null">undefined</span>`
        if (typeof val === 'boolean') return `<span class="aj-bool">${val}</span>`
        if (typeof val === 'number') return `<span class="aj-num">${val}</span>`
        if (typeof val === 'string') {
          const esc = val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          return `<span class="aj-str">"${esc}"</span>`
        }
        if (Array.isArray(val)) {
          if (val.length === 0) return `<span class="aj-punc">[]</span>`
          const items = val.map(v => `${pad1}${jsonToHtml(v, indent + 1)}`).join(`<span class="aj-punc">,</span>\n`)
          return `<span class="aj-punc">[</span>\n${items}\n${pad}<span class="aj-punc">]</span>`
        }
        const entries = Object.entries(val)
        if (entries.length === 0) return `<span class="aj-punc">{}</span>`
        const items = entries.map(([k, v]) =>
          `${pad1}<span class="aj-key">${k}</span><span class="aj-punc">: </span>${jsonToHtml(v, indent + 1)}`
        ).join(`<span class="aj-punc">,</span>\n`)
        return `<span class="aj-punc">{</span>\n${items}\n${pad}<span class="aj-punc">}</span>`
      }

      // ── Template analysis — clean logic tree ──────────────────────────────────────

      function renderTemplateAnalysis(dom) {
        if (!dom) return '<span style="color:var(--dim);font-size:11px">No template data.</span>'

        const vars = _analysisData.script?.vars || {}

        // Classify a variable name → label for annotation
        function classify(name) {
          const root = name?.split('.')[0]?.split('?')[0]
          const v = vars[root]
          if (!v) return null
          if (v.isWritableDerived)                 return { label: 'writable',  c: '#fc8c30' }
          if (v.kind === 'let'   && v.isProp)      return { label: 'prop',      c: '#e8407a' }
          if (v.kind === 'const' && v.isProp)      return { label: 'immutable', c: '#4da89a' }
          if (v.kind === 'var'   && v.isProp)      return { label: 'snapshot',  c: '#545470' }
          if (v.kind === 'let')                    return { label: 'reactive',  c: '#f5a623' }
          if (v.kind === 'const' && v.isDerived)   return { label: 'derived',   c: '#3abfa8' }
          if (v.kind === 'const')                  return { label: 'static',    c: '#7a9a8a' }
          if (v.kind === 'var')                    return { label: 'sampler',   c: '#545470' }
          return null
        }

        // Extract all identifiers from an expression and annotate the most interesting one
        function annotate(expr) {
          if (!expr) return ''
          // Find identifiers — take first known var
          const idents = [...expr.matchAll(/\b([a-zA-Z_$][a-zA-Z0-9_$]*)\b/g)]
            .map(m => m[1])
            .filter(n => vars[n])
          if (!idents.length) return ''
          // Pick most interesting: prefer let > const/derived > var
          const ranked = idents.sort((a, b) => {
            const rank = v => v?.kind === 'let' ? 0 : v?.kind === 'const' ? 1 : 2
            return rank(vars[a]) - rank(vars[b])
          })
          const name = ranked[0]
          const cls = classify(name)
          if (!cls) return ''
          return `<span style="color:${cls.c};font-size:9px;letter-spacing:.06em;opacity:.85"> ← ${cls.label}</span>`
        }

        // Parse raw directive string into {kind, expr}
        // e.g. "#if !hasItems" → {kind:'if', expr:'!hasItems'}
        //      "#each items as item (item.id)" → {kind:'each', expr:'items', rest:'as item (item.id)'}
        function parseDirective(raw) {
          if (!raw) return null
          const s = raw.replace(/^[#:\/]/, '').trim()
          const m = s.match(/^(\w+)\s*(.*)$/)
          if (!m) return null
          return { kind: m[1], body: m[2].trim() }
        }

        const lines = []

        function pushLine(depth, keyword, kColor, expr, extra, annotation) {
          const indent = depth * 18
          const kw = `<span style="color:${kColor};font-size:10px;letter-spacing:.1em;font-weight:600">${keyword}</span>`
          const ex = expr
            ? `<span style="font-family:var(--mono);font-size:11px;color:var(--text)">${esc(expr)}</span>`
            : ''
          const ext = extra
            ? `<span style="font-size:10px;color:var(--dim)"> ${esc(extra)}</span>`
            : ''
          const ann = annotation || ''
          lines.push(
            `<div style="padding:4px 10px 4px ${indent + 10}px;display:flex;align-items:baseline;` +
            `gap:7px;border-bottom:1px solid rgba(255,255,255,0.03)">` +
            `${kw}${ex}${ext}${ann}</div>`
          )
        }

        function walk(nodes, depth) {
          if (!nodes) return
          const arr = Array.isArray(nodes) ? nodes : [nodes]
          for (const n of arr) {
            if (!n || typeof n !== 'object') continue
            if (n.type === 'text') continue

            if (n.type === 'if') {
              // parts: [{value: '#if expr', body:[...]}, {value: '#else if expr2', body:[...]}, ...]
              for (const part of (n.parts || [])) {
                const d = parseDirective(part.value)
                if (!d) continue
                if (d.kind === 'if') {
                  pushLine(depth, 'IF', '#f5a623', d.body, null, annotate(d.body))
                } else if (d.kind === 'else') {
                  // ':else if expr'
                  const sub = d.body.replace(/^if\s+/, '')
                  if (sub) pushLine(depth, 'ELSE IF', '#f5a623', sub, null, annotate(sub))
                  else     pushLine(depth, 'ELSE', '#c87adc', null, null, null)
                }
                walk(part.body, depth + 1)
              }
              if (n.elsePart) {
                pushLine(depth, 'ELSE', '#c87adc', null, null, null)
                walk(n.elsePart, depth + 1)
              }
            } else if (n.type === 'each') {
              const d = parseDirective(n.value)
              // "#each items as item (key)"
              const eachM = d?.body.match(/^(.+?)\s+as\s+(.+?)(\s+\((.+)\))?$/)
              if (eachM) {
                const expr = eachM[1].trim()
                const as   = eachM[2].trim()
                const key  = eachM[4] ? `(${eachM[4]})` : ''
                pushLine(depth, 'EACH', '#3abfa8', expr,
                  `as ${as}${key ? ' key:' + key : ''}`,
                  annotate(expr)
                )
              } else {
                pushLine(depth, 'EACH', '#3abfa8', d?.body || '', null, null)
              }
              walk(n.mainBlock, depth + 1)
              if (n.elseBlock || n.elsePart) {
                pushLine(depth, 'EACH:ELSE', '#c87adc', null, null, null)
                walk(n.elseBlock || n.elsePart, depth + 1)
              }
            } else if (n.type === 'await') {
              const d = parseDirective(n.value)
              pushLine(depth, 'AWAIT', '#c87adc', d?.body || '', null, annotate(d?.body))
              walk(n.mainBlock, depth + 1)
              if (n.thenValue) {
                pushLine(depth, 'THEN', '#3abfa8', n.thenValue, null, null)
                walk(n.thenBlock, depth + 1)
              }
              if (n.catchValue) {
                pushLine(depth, 'CATCH', '#f5a623', n.catchValue, null, null)
                walk(n.catchBlock, depth + 1)
              }
            } else if (n.type === 'key') {
              const d = parseDirective(n.value)
              pushLine(depth, 'KEY', '#e8407a', d?.body || '', null, annotate(d?.body))
              walk(n.mainBlock, depth + 1)
            } else if (n.type === 'snippet') {
              const d = parseDirective(n.value)
              pushLine(depth, 'SNIPPET', '#7ab8f5', d?.body || n.name || '', null, null)
              walk(n.body, depth + 1)
            } else if (n.type === 'systag') {
              const v = n.value || ''
              if (v.startsWith('@render')) {
                const expr = v.slice(7).trim()
                pushLine(depth, 'RENDER', '#7ab8f5', expr, null, null)
              } else if (v.startsWith('@html')) {
                pushLine(depth, 'HTML', '#f5a623', v.slice(5).trim(), null, null)
              } else if (v.startsWith('@attach')) {
                pushLine(depth, 'ATTACH', '#c49a84', v.slice(7).trim(), null, null)
              }
            } else if (n.type === 'node' && n.name === 'mesa') {
              const tag = 'mesa:' + (n.elArg || '')
              pushLine(depth, tag.toUpperCase(), '#c87adc', null, null, null)
              walk(n.body, depth + 1)
            } else if (n.type === 'node') {
              walk(n.body, depth)
            }
          }
        }

        walk(dom?.body || dom, 0)

        if (!lines.length) {
          return '<div style="padding:16px;color:var(--dim);font-size:11px">No logic blocks in this template.</div>'
        }

        const header = `<div style="padding:6px 10px 6px;font-size:9px;color:var(--dim);` +
          `letter-spacing:.1em;border-bottom:1px solid var(--border);display:flex;gap:16px">` +
          `<span>TEMPLATE LOGIC</span>` +
          `<span style="margin-left:auto;color:var(--border2)">` +
          `<span style="color:#f5a623">■</span> if/each  ` +
          `<span style="color:#3abfa8">■</span> each  ` +
          `<span style="color:#c87adc">■</span> async/key  ` +
          `<span style="color:#7ab8f5">■</span> snippet` +
          `</span></div>`
        return header + lines.join('')
      }

      function renderAnalysisInner() {
        const inner = document.getElementById('analysis-inner')
        const data = _activeAtab === 'script' ? _analysisData.script : _analysisData.template
        if (!data) { inner.innerHTML = '<span style="color:var(--dim);font-size:11px">No data yet.</span>'; return }

        if (_activeAtab === 'script') {
          const sections = [
            ['Variables', data.vars],
            ['Watch Paths', data.watchPaths],
            ['Watch Handlers', data.watchHandlers],
            ['Watch Groups', data.watchGroups],
            ['Context Provides', data.contextProvides],
            ['Effects', data.effects],
            ['Reactive Names', data.reactiveNames],
            ['Errors', data.errors],
            ['Warnings', data.warnings],
          ]
          inner.innerHTML = sections.map(([label, val]) => {
            const empty = Array.isArray(val)
              ? val.length === 0
              : typeof val === 'object' && Object.keys(val).length === 0
            if (empty) return ''
            return `<div class="aj-section">${label}</div><pre style="margin:0;white-space:pre-wrap">${jsonToHtml(val)}</pre>`
          }).join('')
        } else {
          // Template tab — structured directive summary
          inner.innerHTML = renderTemplateAnalysis(_analysisData.template)
        }
      }

      function renderAnalysis(analysis, dom) {
        _analysisData = {
          script: cleanAnalysis(analysis),
          template: cleanDOM(dom)
        }
        if (document.getElementById('panel-analysis').classList.contains('active')) {
          renderAnalysisInner()
        }
      }

      // Analysis sub-tab wiring
      document.querySelectorAll('.atab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.atab').forEach(b => b.classList.remove('active'))
          btn.classList.add('active')
          _activeAtab = btn.dataset.atab
          renderAnalysisInner()
        })
      })

      // ── Source view toggle ────────────────────────────────────────────────────────
      const srcView = document.getElementById('src-view')
      const viewToggle = document.getElementById('view-toggle')
      let isViewing = false

      // ─── Mesa-semantic source view ─────────────────────────────────────────────────
      // Colors variables by reactive role using the last compile's analysis.
      // Falls back to generic tokenizer for extra JS files (non-Mesa).

      // Reactive role → color. Mirrors the graph panel's color scheme.
      // Build a lookup from var name → {color, label} using analysis data
      function buildVarColors(analysis) {
        const map = {}
        if (!analysis?.vars) return map
        const ROLE = {
          'let':          { color: '#fe8a11', label: 'reactive signal' },
          'let-prop':     { color: '#e8407a', label: 'reactive prop' },
          'const':        { color: '#2ec4b6', label: 'derived memo' },
          'const-static': { color: '#7a9a8a', label: 'static value' },
          'const-prop':   { color: '#4da89a', label: 'immutable prop' },
          'var':          { color: '#545470', label: 'non-reactive sampler' },
          'var-prop':     { color: '#403a50', label: 'snapshot prop' },
          'writable':     { color: '#fc8c30', label: 'writable derived' },
          'fn':           { color: '#c49a84', label: 'function' },
        }
        for (const [name, v] of Object.entries(analysis.vars)) {
          let role
          if (v.isWritableDerived)                  role = 'writable'
          else if (v.kind === 'let'   && v.isProp)  role = 'let-prop'
          else if (v.kind === 'const' && v.isProp)  role = 'const-prop'
          else if (v.kind === 'var'   && v.isProp)  role = 'var-prop'
          else if (v.kind === 'let')                role = 'let'
          else if (v.kind === 'const' && v.isDerived) role = 'const'
          else if (v.kind === 'const')              role = 'const-static'
          else if (v.kind === 'var')                role = 'var'
          if (role) map[name] = ROLE[role]
        }
        for (const name of Object.keys(analysis.rootFunctions ?? {})) {
          if (!map[name]) map[name] = ROLE.fn
        }
        return map
      }

      // Escape HTML
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

      // Wrap a token in a colored span with an optional tooltip title
      function col(color, text, title) {
        const t = title ? ' title="' + title.replace(/"/g, '&quot;') + '"' : ''
        return '<span style="color:' + color + '"' + t + '>' + esc(text) + '<\/span>'
      }

      function renderMesaSrcView(code, analysis) {
        const varColors = buildVarColors(analysis)
        // Collect watch dep names for annotation
        const watchDeps = new Set()
        ;(analysis?.watchHandlers || []).forEach(h => h.deps?.forEach(d => watchDeps.add(d.split('.')[0])))
        ;(analysis?.watchPaths || []).forEach(p => watchDeps.add(p.path.split('.')[0]))

        // Split into sections: <script>, <style>, template HTML
        // We'll tokenize each differently
        const sections = []
        let rest = code
        while (rest.length) {
          const scriptM = rest.match(new RegExp('^([\\s\\S]*?)(<script(?:\\s[^>]*)?>)([\\s\\S]*?)(<\\/' + 'script>)', 'i'))
          const styleM  = rest.match(new RegExp('^([\\s\\S]*?)(<style(?:\\s[^>]*)?>)([\\s\\S]*?)(<\\/' + 'style>)',  'i'))
          // Pick whichever comes first
          const sIdx = scriptM ? rest.indexOf(scriptM[2]) : Infinity
          const stIdx = styleM  ? rest.indexOf(styleM[2])  : Infinity
          if (sIdx === Infinity && stIdx === Infinity) { sections.push({ type: 'tpl', src: rest }); break }
          if (sIdx <= stIdx && scriptM) {
            if (scriptM[1]) sections.push({ type: 'tpl', src: scriptM[1] })
            sections.push({ type: 'script-open', src: scriptM[2] })
            sections.push({ type: 'script', src: scriptM[3] })
            sections.push({ type: 'tag-close', src: scriptM[4] })
            rest = rest.slice(scriptM[1].length + scriptM[2].length + scriptM[3].length + scriptM[4].length)
          } else if (styleM) {
            if (styleM[1]) sections.push({ type: 'tpl', src: styleM[1] })
            sections.push({ type: 'script-open', src: styleM[2] })
            sections.push({ type: 'script', src: styleM[3] })
            sections.push({ type: 'tag-close', src: styleM[4] })
            rest = rest.slice(styleM[1].length + styleM[2].length + styleM[3].length + styleM[4].length)
          } else break
        }

        const htmlParts = []

        for (const sec of sections) {
          if (sec.type === 'script-open' || sec.type === 'tag-close') {
            htmlParts.push(col('#545470', sec.src))
          } else if (sec.type === 'script') {
            htmlParts.push(highlightScript(sec.src, varColors, watchDeps, analysis))
          } else {
            // Template section
            htmlParts.push(highlightTemplate(sec.src, varColors))
          }
        }

        return htmlParts.join('')
      }

      function highlightScript(code, varColors, watchDeps, analysis) {
        // Tokenize Mesa script: keywords, strings, comments, $: labels, identifiers
        const out = []
        let i = 0
        const ch = () => code[i]
        const peek = (n=1) => code[i+n]

        while (i < code.length) {
          // Line comment
          if (ch() === '/' && peek() === '/') {
            const end = code.indexOf('\n', i)
            const s = end === -1 ? code.slice(i) : code.slice(i, end)
            out.push(col('#545470', s))
            i += s.length
            continue
          }
          // Block comment
          if (ch() === '/' && peek() === '*') {
            const end = code.indexOf('*/', i + 2)
            const s = end === -1 ? code.slice(i) : code.slice(i, end + 2)
            out.push(col('#545470', s))
            i += s.length
            continue
          }
          // Template literal
          if (ch() === '`') {
            let s = '`'; i++
            while (i < code.length && code[i] !== '`') {
              if (code[i] === '\\') { s += code[i] + (code[i+1]||''); i += 2; continue }
              s += code[i++]
            }
            s += '`'; i++
            out.push(col('#48bb78', s))
            continue
          }
          // String
          if (ch() === '"' || ch() === "'") {
            const q = ch(); let s = q; i++
            while (i < code.length && code[i] !== q) {
              if (code[i] === '\\') { s += code[i] + (code[i+1]||''); i += 2; continue }
              s += code[i++]
            }
            s += q; i++
            out.push(col('#48bb78', s))
            continue
          }
          // $: or $_name: label
          if (ch() === '$' && (peek() === ':' || peek() === '_')) {
            const m = code.slice(i).match(/^\$[\w]*\s*:/)
            if (m) {
              out.push(col('#ee380d', m[0], 'Mesa reactive annotation'))
              i += m[0].length
              continue
            }
          }
          // Identifier or keyword
          if (/[a-zA-Z_$]/.test(ch())) {
            const m = code.slice(i).match(/^[a-zA-Z_$][\w$]*/)
            const word = m[0]; i += word.length
            const KEYWORDS = { const:1, let:1, var:1, function:1, async:1, await:1,
              return:1, if:1, else:1, for:1, while:1, export:1, import:1, from:1,
              default:1, class:1, new:1, typeof:1, void:1, null:1, true:1, false:1,
              undefined:1, this:1, try:1, catch:1, throw:1, switch:1, case:1, break:1, continue:1 }
            if (KEYWORDS[word]) {
              // export let/const/var — color the keyword in the var's role color
              out.push(col('#6699cc', word))
            } else if (varColors[word]) {
              const { color, label } = varColors[word]
              const hint = watchDeps.has(word) ? `${label} · watched` : label
              out.push(col(color, word, hint))
            } else {
              out.push(col('#c49a84', word))
            }
            continue
          }
          // Number
          if (/\d/.test(ch())) {
            const m = code.slice(i).match(/^\d+\.?\d*/)
            out.push(col('#e2b96f', m[0]))
            i += m[0].length
            continue
          }
          // Newline — preserve as-is
          if (ch() === '\n') { out.push('\n'); i++; continue }
          // Everything else
          out.push(esc(ch())); i++
        }
        return out.join('')
      }

      function highlightTemplate(code, varColors) {
        // Highlight Mesa template: HTML tags, {expr}, {#if}, {#each}, {#key} etc.
        const out = []
        let i = 0
        while (i < code.length) {
          // Mesa block directive: {#if, {#each, {#key, {:else, {/if etc.
          if (code[i] === '{' && /[#/:]/.test(code[i+1]||'')) {
            const end = code.indexOf('}', i)
            const s = end === -1 ? code.slice(i) : code.slice(i, end + 1)
            out.push(col('#ee380d', s, 'Mesa directive'))
            i += s.length
            continue
          }
          // Mesa expression: {expr}
          if (code[i] === '{') {
            let depth = 0; let j = i
            while (j < code.length) {
              if (code[j] === '{') depth++
              else if (code[j] === '}') { depth--; if (!depth) { j++; break } }
              j++
            }
            const s = code.slice(i, j)
            // Highlight the braces in orange, content lighter
            out.push(`<span style="color:#fe8a11;opacity:.6">{</span>`)
            out.push(col('#fe8a11', s.slice(1, -1)))
            out.push(`<span style="color:#fe8a11;opacity:.6">}</span>`)
            i = j
            continue
          }
          // HTML tag
          if (code[i] === '<' && /[a-zA-Z/!]/.test(code[i+1]||'')) {
            // Find tag end (>, or />, but not inside strings)
            let j = i + 1; let inStr = null
            while (j < code.length) {
              if (!inStr && (code[j] === '"' || code[j] === "'")) inStr = code[j]
              else if (inStr && code[j] === inStr) inStr = null
              else if (!inStr && code[j] === '>') { j++; break }
              j++
            }
            const tag = code.slice(i, j)
            const tagNameM = tag.match(/^<\/?([A-Za-z][^\s>\/]*)/)
            const tagName = tagNameM?.[1] || ''
            const isComponent = /^[A-Z]/.test(tagName) || tagName.includes(':')
            const tagColor = isComponent ? '#e8407a' : '#4a9eff'
            // Parse the tag into: opener (</ or <), name, rest-of-attrs, closer (> or />)
            const openerM = tag.match(/^(<\/?)([A-Za-z][^\s>\/]*)(.*)$/s)
            if (openerM) {
              const [, slash, name, rest] = openerM
              // Color the name
              let html = esc(slash) + col(tagColor, name)
              // Process attrs token by token to avoid regex-on-HTML issues
              // Split rest into: attr strings, Mesa attrs, and plain text
              let r = rest
              while (r.length) {
                // Mesa bind:/on: prefix
                const mesaM = r.match(/^(bind:|on:)/)
                if (mesaM) {
                  // Read until whitespace or >
                  const attrM = r.match(/^([^\s=>]+)/)
                  const attrName = attrM ? attrM[1] : mesaM[1]
                  html += col('#fe8a11', attrName)
                  r = r.slice(attrName.length)
                  continue
                }
                // Quoted attribute value ="..."
                const valM = r.match(/^(=")([^"]*)(")/)
                if (valM) {
                  html += '=' + col('#48bb78', '"' + esc(valM[2]) + '"')
                  r = r.slice(valM[0].length)
                  continue
                }
                // {expr} in attrs
                if (r[0] === '{') {
                  let depth = 0, k = 0
                  while (k < r.length) {
                    if (r[k] === '{') depth++
                    else if (r[k] === '}') { depth--; if (!depth) { k++; break } }
                    k++
                  }
                  html += col('#fe8a11', esc(r.slice(0, k)))
                  r = r.slice(k)
                  continue
                }
                // closer /> or >
                if (r.startsWith('/>')) { html += '/>'; r = r.slice(2); continue }
                if (r[0] === '>') { html += '>'; r = r.slice(1); continue }
                // whitespace and other chars
                html += esc(r[0]); r = r.slice(1)
              }
              out.push(html)
            } else {
              out.push(esc(tag))
            }
            i = j
            continue
          }
          // HTML comment <!-- -->
          if (code.slice(i, i+4) === '<!--') {
            const end = code.indexOf('-->', i)
            const s = end === -1 ? code.slice(i) : code.slice(i, end + 3)
            out.push(col('#545470', s))
            i += s.length
            continue
          }
          // Newline
          if (code[i] === '\n') { out.push('\n'); i++; continue }
          // Plain text
          out.push(esc(code[i])); i++
        }
        return out.join('')
      }

      function renderSrcView(code) {
        // Get the last analysis from the most recent compile
        const analysis = window.__lastMesaAnalysis
        const isMesaFile = files[activeFileIdx]?.name?.endsWith('.mesa') ||
                           code.startsWith('---\n') ||
                           code.includes('<script>') || code.includes('<script ')
        const rendered = isMesaFile
          ? renderMesaSrcView(code, analysis)
          : (() => {
              // Plain JS file — use generic tokenizer
              const tokens = tokenize(code)
              const lines = [[]]
              for (const tok of tokens) {
                if (tok.c === '__nl') { lines.push([]); continue }
                lines[lines.length - 1].push(tok)
              }
              return lines.map(line =>
                line.map(tok =>
                  `<span style="color:${tok.c}">${tok.t
                    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`
                ).join('')
              ).join('\n')
            })()
        srcView.innerHTML = rendered
      }

      function setViewMode(viewing) {
        isViewing = viewing
        const cmEl = document.getElementById('cm-editor')
        if (viewing) {
          renderSrcView(getEditorValue())
          srcView.classList.add('active')
          cmEl.classList.add('hidden')
          viewToggle.classList.add('viewing')
          viewToggle.textContent = '✎ Edit'
        } else {
          srcView.classList.remove('active')
          cmEl.classList.remove('hidden')
          viewToggle.classList.remove('viewing')
          viewToggle.textContent = '◈ View'
          cmView?.focus()
        }
      }

      viewToggle.addEventListener('click', () => setViewMode(!isViewing))

      // ─── Draggable divider ────────────────────────────────────────────────────────
      ;(() => {
        const divider = document.getElementById('divider')
        const left    = document.getElementById('left')
        const main    = document.getElementById('main')
        let dragging  = false
        let startX    = 0
        let startW    = 0

        divider.addEventListener('mousedown', (e) => {
          dragging = true
          startX   = e.clientX
          startW   = left.getBoundingClientRect().width
          divider.classList.add('dragging')
          document.body.style.cursor    = 'col-resize'
          document.body.style.userSelect = 'none'
          e.preventDefault()
        })

        document.addEventListener('mousemove', (e) => {
          if (!dragging) return
          const mainW  = main.getBoundingClientRect().width
          const delta  = e.clientX - startX
          const newW   = Math.min(Math.max(startW + delta, 200), mainW - 205)
          left.style.width = newW + 'px'
        })

        document.addEventListener('mouseup', () => {
          if (!dragging) return
          dragging = false
          divider.classList.remove('dragging')
          document.body.style.cursor     = ''
          document.body.style.userSelect = ''
        })

        // Touch support
        divider.addEventListener('touchstart', (e) => {
          dragging = true
          startX   = e.touches[0].clientX
          startW   = left.getBoundingClientRect().width
          divider.classList.add('dragging')
          e.preventDefault()
        }, { passive: false })

        document.addEventListener('touchmove', (e) => {
          if (!dragging) return
          const mainW = main.getBoundingClientRect().width
          const delta = e.touches[0].clientX - startX
          const newW  = Math.min(Math.max(startW + delta, 200), mainW - 205)
          left.style.width = newW + 'px'
        }, { passive: true })

        document.addEventListener('touchend', () => {
          dragging = false
          divider.classList.remove('dragging')
        })
      })()

      // Textarea event listeners removed — CM handles input/keydown via updateListener + keymap.
      // Fallback: if CM init failed, wire the textarea manually.
      document.getElementById('editor').addEventListener('input', () => {
        if (!cmFallback) return
        const val = document.getElementById('editor').value
        files[activeFileIdx].content = val
        if (activeFileIdx === 0) scheduleCompile(val)
        else scheduleCompile(files[0].content)
      })

      // ─── $: Reference panel ───────────────────────────────────────────────────────
      const RX_SECTIONS = [
        {
          title: 'Path watch',
          desc: 'external objects',
          code: `import { user, cart } from './store.js'\n\n$: user              // watch entire object\n$: user.name         // surgical — only user.name\n$: cart.total        // ignores cart.items\n$: (cart.items, cart.total)   // multi-path`,
          note: 'Use on <strong>imported plain JS objects</strong> (store files). Wraps the object in a Proxy — mutations trigger re-renders. Not for local <code>let</code> signals — those re-render on assignment.',
          error: null,
          example: 'reactiveObject'
        },
        {
          title: 'Auto-tracked effect',
          desc: 'runs when any dep changes',
          code: `$: console.log(count)           // single expression\n$: document.title = name        // assignment\n\n$: {                            // block — multiple statements\n  console.log(count)\n  document.title = name\n}`,
          note: 'Deps are <strong>auto-detected</strong> — any reactive variable read inside re-runs the effect when it changes. The block form supports <code>if</code>, <code>for</code>, etc.',
          error: '$: if (x) { } — compiler error. Use $: { if (x) { } } instead.',
          example: 'watchHandler'
        },
        {
          title: 'Watch + handler',
          desc: 'explicit dep, untracked handler',
          code: `$: count, () => save()          // single dep\n$: count, saveRef               // fn reference shorthand\n\n$: (count, name), () => {      // multi-dep\n  sync(count, name)\n}\n\n$: selectedId, async () => {   // async + cleanup\n  const ctrl = new AbortController()\n  $onCleanup(() => ctrl.abort())\n  data = await fetch('/api/' + selectedId, {\n    signal: ctrl.signal\n  }).then(r => r.json())\n}`,
          note: 'The <strong>handler body is untracked</strong> — only the explicit dep(s) trigger re-runs. The handler is always the <strong>last item after a comma, outside any parens</strong>.',
          error: null,
          example: 'watchAsync'
        },
        {
          title: 'Ordered watch group',
          desc: 'guaranteed execution order',
          code: `$: {\n  stateSignal, () => resetPage()\n  stateSignal, () => fetchData()\n  stateSignal, () => logAnalytics()\n}`,
          note: 'Multiple watch+handlers that <strong>must fire in order</strong>. Each subscribes individually — all run on the same flush in declaration order. The <code>$: { }</code> block containing only <code>dep, fn</code> pairs is the ordered group form.',
          error: null,
          example: 'orderedGroup'
        },
        {
          title: 'Writable derived',
          desc: '$: name = expr',
          code: `$: selected = items[0]   // re-derives when items changes\n$: doubled = count * 2   // re-derives when count changes`,
          note: 'Re-derives when deps change, but can be <strong>overridden</strong> by <code>bind:value</code> or direct assignment. The override holds until the next dep change — then derivation wins back. For permanent detachment, use <code>let</code> with a watch+handler.',
          error: null,
          example: 'writableDerived'
        },
        {
          title: 'Debug label',
          desc: '$_name: prefix',
          code: `$_fetchData: selectedId, async () => { ... }\n$_total: total = items.reduce(...)`,
          note: 'Prefix any <code>$:</code> form with <code>$_name:</code> to attach a <strong>debug label</strong> visible in the Graph panel and runtime dev tools. The underscore is required — <code>$name:</code> without it is a compiler error.',
          error: null,
          example: 'debugLabels'
        },
      ]

      function buildReactivityRef() {
        const inner = document.getElementById('reactivity-inner')
        if (inner.children.length) return // already built
        inner.innerHTML = ''
        for (const sec of RX_SECTIONS) {
          const el = document.createElement('div')
          el.className = 'rx-section'
          el.innerHTML = `
            <div class="rx-section-hdr">
              <span class="rx-chevron">▾</span>
              <span class="rx-title">${sec.title}</span>
              <span class="rx-desc">${sec.desc}</span>
            </div>
            <div class="rx-body">
              <div class="rx-code">${sec.code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
              ${sec.note ? `<p class="rx-note">${sec.note}</p>` : ''}
              ${sec.error ? `<p class="rx-error">⚠ <code>${sec.error.replace(/</g,'&lt;')}</code></p>` : ''}
              ${sec.example ? `<span class="rx-try" data-ex="${sec.example}">▶ Try example</span>` : ''}
            </div>`
          el.querySelector('.rx-section-hdr').addEventListener('click', () => {
            el.classList.toggle('collapsed')
          })
          const tryBtn = el.querySelector('.rx-try')
          if (tryBtn) {
            tryBtn.addEventListener('click', () => {
              loadExample(tryBtn.dataset.ex)
              // Switch to preview tab
              document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'))
              document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'))
              document.querySelector('.tab[data-tab="preview"]').classList.add('active')
              document.getElementById('panel-preview').classList.add('active')
            })
          }
          inner.appendChild(el)
        }
      }

      document.querySelectorAll('.tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'))
          document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'))
          btn.classList.add('active')
          document.getElementById('panel-' + btn.dataset.tab).classList.add('active')
          if (btn.dataset.tab === 'output') renderOutput(compiledJS)
          if (btn.dataset.tab === 'analysis') renderAnalysisInner()
          if (btn.dataset.tab === 'reactivity') buildReactivityRef()
        })
      })

      document.getElementById('copy-src').addEventListener('click', () => {
        navigator.clipboard?.writeText(getEditorValue()).catch(() => {
          const el = document.createElement('textarea')
          el.value = getEditorValue()
          el.style.cssText = 'position:fixed;top:-9999px;opacity:0'
          document.body.appendChild(el)
          el.focus()
          el.select()
          document.execCommand('copy')
          document.body.removeChild(el)
        })
        const btn = document.getElementById('copy-src')
        btn.textContent = 'Copied ✓'
        btn.style.color = '#fe8a11'
        btn.style.borderColor = '#fe8a11'
        setTimeout(() => {
          btn.textContent = 'Copy'
          btn.style.color = ''
          btn.style.borderColor = ''
        }, 1500)
      })

      // ─── Open Standalone ──────────────────────────────────────────────────────────
      // Fetches runtime.js as raw text, creates a blob URL for it, patches the
      // compiled output to import from that blob URL, wraps in mounting HTML,
      // and opens the whole thing as a second blob in a new tab.
      // Works in all modern browsers — module scripts can import other blob URLs.

      document.getElementById('open-standalone').addEventListener('click', async () => {
        if (!compiledJS) {
          setStatus('orange', 'Nothing compiled yet')
          return
        }
        const btn = document.getElementById('open-standalone')
        btn.textContent = 'Opening…'
        try {
          // 1. Fetch the runtime as raw source text.
          // Relative to this PAGE, which is `example/` — so `./runtime.js` is
          // `example/runtime.js`, which has never existed. There is no
          // re-export at the package root either: the runtime is `src/`.
          const runtimeSrc = await fetch('../src/runtime.js').then((r) => {
            if (!r.ok) throw new Error('Could not load runtime.js: ' + r.status)
            return r.text()
          })

          // 2. Create a blob URL for the runtime so the compiled module can import it.
          const runtimeBlob = new Blob([runtimeSrc], { type: 'application/javascript' })
          const runtimeUrl = URL.createObjectURL(runtimeBlob)

          // 3. Patch the compiled output:
          //    • swap '@frontierjs/mesa/runtime.js' import for the runtime blob URL
          //    • replace `export default ` with `const __MesaComponent = `
          const patchedJS = compiledJS
            .replace(/from\s+'@frontierjs\/mesa\/runtime\.js'/, `from '${runtimeUrl}'`)
            .replace(/^export default\s+/m, 'const __MesaComponent = ')

          // 4. Build the full self-contained HTML.
          const filename = files[0].name || 'Component'
          const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa — ${filename}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      padding: 24px;
      background: #faf9f7;
      color: #1e1e2e;
    }
    h1, h2, h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
    p  { margin: 0 0 6px; font-size: 14px; line-height: 1.6; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 10px 0; }
    label { font-size: 12px; color: #6b7280; font-weight: 500; }
    button {
      background: #1e1e2e; color: #fff; border: none;
      padding: 5px 13px; border-radius: 4px; cursor: pointer;
      font-size: 12px; margin: 2px 3px 2px 0;
      font-family: inherit; transition: background .1s;
    }
    button:hover { background: #374151; }
    input, textarea, select {
      border: 1px solid #d1d5db; border-radius: 4px;
      padding: 5px 9px; font-size: 13px; font-family: inherit;
      margin: 2px 3px 2px 0; outline: none;
      transition: border-color .1s;
    }
    input:focus, textarea:focus { border-color: #6366f1; }
    textarea { resize: vertical; }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
${patchedJS}

const anchor = document.createComment('')
document.getElementById('app').appendChild(anchor)
__MesaComponent(anchor, {}, null)
<\/script>
</body>
</html>`

          // 5. Open in a new tab.
          const htmlBlob = new Blob([html], { type: 'text/html' })
          const htmlUrl = URL.createObjectURL(htmlBlob)
          window.open(htmlUrl, '_blank')

          // Revoke the runtime blob after a delay — the opened tab has its own
          // reference so a short delay is enough for the module to load.
          setTimeout(() => URL.revokeObjectURL(runtimeUrl), 10_000)
          setTimeout(() => URL.revokeObjectURL(htmlUrl), 10_000)
        } catch (e) {
          console.error('[Mesa REPL] Open standalone failed:', e)
          setStatus('red', 'Standalone failed: ' + e.message)
        } finally {
          btn.textContent = 'Open standalone ↗'
        }
      })

      // ─── Shareable URL — encode/decode file state in URL hash ─────────────────────
      //
      // State: { files: [{name, content},...], activeFileIdx: number }
      // Encoding: JSON → LZString.compressToEncodedURIComponent → #s=<encoded>
      // LZString keeps hashes short — typical Mesa component compresses 5-10x.

      function encodeState() {
        const state = {
          files: files.map(f => ({ name: f.name, content: f.content })),
          activeFileIdx
        }
        return LZString.compressToEncodedURIComponent(JSON.stringify(state))
      }

      function decodeState(encoded) {
        try {
          const json = LZString.decompressFromEncodedURIComponent(encoded)
          if (!json) return null
          const state = JSON.parse(json)
          if (!Array.isArray(state.files) || !state.files.length) return null
          return state
        } catch { return null }
      }

      function getHashState() {
        const hash = location.hash
        const m = hash.match(/[#&]s=([^&]*)/)
        return m ? decodeState(m[1]) : null
      }

      function pushHashState() {
        const encoded = encodeState()
        const newHash = '#s=' + encoded
        // Use replaceState to avoid polluting browser history on every keystroke
        window.history.replaceState(null, '', newHash)
      }

      function copyShareLink() {
        // Sync current editor content to files before encoding
        files[activeFileIdx].content = getEditorValue()
        pushHashState()
        const url = location.href
        navigator.clipboard.writeText(url).then(() => {
          const btn = document.getElementById('share-btn')
          const prev = btn.textContent
          btn.textContent = 'Copied! ✓'
          btn.style.color = 'var(--teal)'
          setTimeout(() => {
            btn.textContent = prev
            btn.style.color = ''
          }, 2000)
        }).catch(() => {
          const inp = document.createElement('input')
          inp.value = url
          document.body.appendChild(inp)
          inp.select()
          document.execCommand('copy')
          document.body.removeChild(inp)
        })
      }

      document.getElementById('share-btn').addEventListener('click', copyShareLink)

      // ─── Vim mode toggle ──────────────────────────────────────────────────────────
      const vimBtn = document.getElementById('vim-btn')
      function updateVimBtn() {
        vimBtn.textContent = vimEnabled ? 'Vim ✓' : 'Vim'
        vimBtn.style.color = vimEnabled ? 'var(--orange)' : ''
        vimBtn.style.borderColor = vimEnabled ? 'var(--orange)' : ''
      }
      updateVimBtn()
      vimBtn.addEventListener('click', () => {
        vimEnabled = !vimEnabled
        localStorage.setItem('mesa-vim', vimEnabled ? '1' : '0')
        updateVimBtn()
        // Reinit editor to apply/remove vim extension
        const content = getEditorValue()
        const filename = files[activeFileIdx].name
        initCMEditor(content, filename)
      })

      // ─── Theme toggle ─────────────────────────────────────────────────────────────
      const THEMES = ['mesa', 'dark', 'light']
      const themeBtn = document.getElementById('theme-btn')
      let currentTheme = localStorage.getItem('mesa-theme') || 'mesa'

      function applyTheme(t) {
        currentTheme = t
        document.documentElement.setAttribute('data-theme', t)
        localStorage.setItem('mesa-theme', t)
        const label = t.charAt(0).toUpperCase() + t.slice(1)
        themeBtn.textContent = label + ' ◑'
        themeBtn.style.color = t === 'mesa' ? 'var(--orange)'
                             : t === 'dark'  ? 'var(--teal)'
                             : 'var(--muted)'
        themeBtn.style.borderColor = themeBtn.style.color
      }

      themeBtn.addEventListener('click', () => {
        const next = THEMES[(THEMES.indexOf(currentTheme) + 1) % THEMES.length]
        applyTheme(next)
      })

      applyTheme(currentTheme)

      // ─── Boot ─────────────────────────────────────────────────────────────────────
      document.getElementById('boot-msg').textContent = 'Ready'
      document.getElementById('boot-overlay').style.display = 'none'

      renderFileTabs()

      // Restore from URL hash if present, otherwise load default example
      const _hashState = getHashState()
      if (_hashState) {
        files = _hashState.files
        activeFileIdx = Math.min(_hashState.activeFileIdx ?? 0, files.length - 1)
        const _f = files[activeFileIdx]
        initCMEditor(_f.content, _f.name)
        renderFileTabs()
        scheduleCompile(_f.content)
        setStatus('green', 'Restored from link')
      } else {
        loadExample(DEFAULT_EXAMPLE)
      }

      setStatus('green', 'Ready')
    </script>
  </body>
</html>
