<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa REPL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <!-- @frontierjs/css — the design system @frontierjs/ui is written in.
         Reachable only when the server root is the monorepo root (npm run
         serve). It is FULLY layered — every rule sits inside @layer — so it
         cannot touch this page's own unlayered chrome, and a 404 here costs
         nothing but unstyled @ui components. -->
    <link rel="stylesheet" href="../../css/dist/frontier.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind Play CDN — disable preflight so it doesn't conflict with REPL
      // or component styles.
      //
      // This has to run AFTER the CDN script, not before it. Setting
      // `window.tailwind.config` first looks like it should work and does
      // nothing: the CDN assigns its own `window.tailwind` on load and the
      // earlier object is discarded. Preflight was therefore live the whole
      // time, and it is a global reset at specificity (0,0,1) injected after
      // this page's <style> — so it won every tie, including
      // `button,input,… { margin: 0; padding: 0 }` over the preview's own
      // button styling, and it would beat any plain element rule a component
      // declared for itself.
      window.tailwind.config = { corePlugins: { preflight: false } }
    </script>
    <style>
      /* ── Themes ──────────────────────────────────────────────────────────── */

      /* Mesa — desert sunset, pulled from the Mesa logo */
      :root, [data-theme="mesa"] {
        --bg0:    #0a0806;       /* near-black with warmth */
        --bg1:    #110d18;       /* deep violet-black — shadow of the mesa */
        --bg2:    #1a1428;       /* lifted violet dark */
        --border: #2a1e40;       /* violet border */
        --border2:#3d2a5e;       /* brighter violet accent border */
        --red:    #f53a1a;       /* fiery orange-red — sun edge */
        --orange: #f5a623;       /* saturated golden amber — sun disk */
        --orange2:#e8880a;       /* deeper amber */
        --pink:   #e8407a;       /* electric coral-magenta — cloud highlight */
        --teal:   #3abfa8;       /* saguaro cactus teal */
        --text:   #f0d8c0;       /* warm parchment */
        --muted:  #c87adc;       /* electric violet — cloud purple */
        --dim:    #5a4878;       /* muted violet — shadow */
        --err:    #f53a1a;
        --mono:   'Berkeley Mono', 'JetBrains Mono', 'Fira Code', monospace;
        --pv-bg:       #faf7f2;
        --pv-hdr-bg:   #f0ebe2;
        --pv-hdr-bdr:  #e0d5c5;
        --pv-hdr-lbl:  #9a7a8a;
      }

      /* Dark — cool pure dark, neutral grays, blue accent */
      [data-theme="dark"] {
        --bg0:    #0f0f0f;
        --bg1:    #161616;
        --bg2:    #1e1e1e;
        --border: #2a2a2a;
        --border2:#333333;
        --red:    #f87171;
        --orange: #60a5fa;
        --orange2:#3b82f6;
        --pink:   #c084fc;
        --teal:   #34d399;
        --text:   #e5e5e5;
        --muted:  #a3a3a3;
        --dim:    #525252;
        --err:    #ef4444;
        --mono:   'Berkeley Mono', 'JetBrains Mono', 'Fira Code', monospace;
        --pv-bg:       #1a1a1a;
        --pv-hdr-bg:   #111111;
        --pv-hdr-bdr:  #2a2a2a;
        --pv-hdr-lbl:  #6b7280;
      }

      /* Light — warm off-white, ink text */
      [data-theme="light"] {
        --bg0:    #f5f4f1;
        --bg1:    #eceae5;
        --bg2:    #e4e1db;
        --border: #d0cdc6;
        --border2:#b8b4ac;
        --red:    #c0392b;
        --orange: #c25e00;
        --orange2:#a84f00;
        --pink:   #c0166a;
        --teal:   #0e7490;
        --text:   #1a1814;
        --muted:  #3d3830;
        --dim:    #8a8278;
        --err:    #b91c1c;
        --mono:   'Berkeley Mono', 'JetBrains Mono', 'Fira Code', monospace;
        --pv-bg:       #ffffff;
        --pv-hdr-bg:   #f0ede8;
        --pv-hdr-bdr:  #dedad3;
        --pv-hdr-lbl:  #7a7068;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg0);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ─────────────────────────────────────────────────────────── */
      #hdr {
        display: flex;
        align-items: center;
        height: 44px;
        background: var(--bg1);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      #logo {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        border-right: 1px solid var(--border);
        height: 100%;
        flex-shrink: 0;
      }
      #logo .wordmark {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.22em;
        color: #fff;
      }
      #logo .wordmark em {
        color: var(--red);
        font-style: normal;
      }
      .vtag {
        font-size: 8px;
        color: var(--red);
        border: 1px solid rgba(238, 56, 13, 0.3);
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(238, 56, 13, 0.06);
        letter-spacing: 0.1em;
      }
      #ex-area {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        flex: 1;
      }

      /* ── Examples drawer ──────────────────────────────────────────────────── */
      #ex-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 100;
      }
      #ex-backdrop.open { display: block; }

      #ex-drawer {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 300px;
        background: var(--bg1);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        z-index: 101;
        transform: translateX(-100%);
        transition: transform 0.18s ease;
      }
      #ex-drawer.open { transform: translateX(0); }

      #ex-drawer-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 44px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        background: var(--bg1);
      }
      #ex-drawer-title {
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #ex-drawer-close {
        background: none;
        border: none;
        color: var(--dim);
        cursor: pointer;
        font-size: 13px;
        font-family: var(--mono);
        padding: 4px 6px;
        border-radius: 3px;
        transition: color .1s;
      }
      #ex-drawer-close:hover { color: var(--text); }

      #ex-search-wrap {
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--bg1);
        flex-shrink: 0;
      }
      #ex-search {
        width: 100%;
        background: var(--bg0);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 11px;
        padding: 5px 9px;
        outline: none;
        transition: border-color .15s;
      }
      #ex-search:focus { border-color: var(--orange); }
      #ex-search::placeholder { color: var(--dim); }

      #ex-drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      #ex-drawer-body::-webkit-scrollbar { width: 4px; }
      #ex-drawer-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

      .ex-group {
        margin-bottom: 2px;
      }
      .ex-group-hdr {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 16px 4px;
        cursor: pointer;
        user-select: none;
      }
      .ex-group-chevron {
        font-size: 8px;
        color: var(--dim);
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      .ex-group.collapsed .ex-group-chevron { transform: rotate(-90deg); }
      .ex-group-name {
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .ex-group-count {
        font-size: 9px;
        color: var(--dim);
        opacity: 0.5;
        margin-left: auto;
      }
      .ex-group-items {
        overflow: hidden;
      }
      .ex-group.collapsed .ex-group-items { display: none; }

      .ex-item {
        display: flex;
        align-items: center;
        padding: 7px 16px 7px 28px;
        cursor: pointer;
        border-left: 2px solid transparent;
        transition: background 0.08s, border-color 0.08s;
        gap: 8px;
      }
      .ex-item:hover { background: rgba(255,255,255,0.03); }
      .ex-item.active {
        border-left-color: var(--orange);
        background: rgba(254,138,17,0.06);
      }
      .ex-item-name {
        font-size: 11px;
        color: var(--muted);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ex-item.active .ex-item-name { color: var(--text); }
      .ex-item-file {
        font-size: 9px;
        color: var(--dim);
        flex-shrink: 0;
      }
      select {
        background: var(--bg2);
        color: var(--text);
        border: 1px solid var(--border2);
        font-family: var(--mono);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
        outline: none;
      }
      #status-area {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-left: 1px solid var(--border);
        height: 100%;
        flex-shrink: 0;
      }
      #sdot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--dim);
        transition: background 0.2s;
        flex-shrink: 0;
      }
      #smsg {
        font-size: 9px;
        letter-spacing: 0.06em;
        color: var(--dim);
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Layout ──────────────────────────────────────────────────────────── */
      #main {
        display: flex;
        flex: 1;
        overflow: hidden;
        min-height: 0;
      }
      #left {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
        width: 50%;
        min-width: 200px;
        max-width: 85%;
      }
      #divider {
        width: 5px;
        background: var(--border);
        cursor: col-resize;
        flex-shrink: 0;
        position: relative;
        transition: background 0.15s;
        z-index: 10;
      }
      #divider:hover, #divider.dragging { background: var(--orange); }
      #right {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex: 1;
        min-width: 200px;
      }
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Panel header ────────────────────────────────────────────────────── */
      .ph {
        display: flex !important;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        gap: .5rem;
        height: 34px;
        padding: 0 14px;
        background: var(--bg1);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .ph .pip {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .ph .plbl {
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        flex: 1;
      }
      .cbtn {
        background: transparent;
        border: 1px solid var(--border2);
        color: var(--dim);
        font-family: var(--mono);
        font-size: 9px;
        padding: 2px 8px;
        border-radius: 3px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .cbtn:hover {
        color: var(--orange);
        border-color: var(--orange);
      }
      .ftag {
        font-size: 9px;
        color: var(--dim);
        border: 1px solid var(--border2);
        padding: 1px 6px;
        border-radius: 2px;
      }

      /* ── Group bar ───────────────────────────────────────────────────────── */
      #group-bar {
        display: none;
        align-items: center;
        gap: 0;
        background: var(--bg1);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        overflow-x: auto;
        scrollbar-width: none;
        min-height: 28px;
        padding: 0 6px;
      }
      #group-bar::-webkit-scrollbar { display: none; }
      #group-bar.visible { display: flex; }
      .gbar-label {
        font-size: 8px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 0 8px 0 4px;
        flex-shrink: 0;
        white-space: nowrap;
        border-right: 1px solid var(--border);
        margin-right: 6px;
        align-self: stretch;
        display: flex;
        align-items: center;
      }
      .gbar-item {
        font-size: 10px;
        color: var(--dim);
        padding: 3px 9px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color .1s, background .1s;
        font-family: var(--mono);
      }
      .gbar-item:hover { color: var(--muted); background: rgba(255,255,255,0.04); }
      .gbar-item.active {
        color: var(--orange);
        background: rgba(254,138,17,0.08);
      }
      #group-bar.edited .gbar-item { opacity: 0.45; }
      #group-bar.edited .gbar-item.active { opacity: 0.6; }

      /* ── File tabs ───────────────────────────────────────────────────────── */
      #file-tabs {
        display: flex;
        align-items: stretch;
        background: var(--bg1);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        overflow-x: auto;
        scrollbar-width: none;
        min-height: 30px;
      }
      #file-tabs::-webkit-scrollbar { display: none; }
      .ftab {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 10px 0 12px;
        font-size: 10.5px;
        color: var(--dim);
        border-right: 1px solid var(--border);
        cursor: pointer;
        white-space: nowrap;
        background: transparent;
        border-top: none;
        border-bottom: none;
        border-left: none;
        font-family: var(--mono);
        flex-shrink: 0;
        transition: color .1s;
      }
      .ftab:hover { color: var(--muted); }
      .ftab.active {
        color: var(--text);
        background: var(--bg0);
        border-bottom: 1px solid var(--bg0);
        margin-bottom: -1px;
      }
      .ftab .fname {
        outline: none;
        background: transparent;
        border: none;
        color: inherit;
        font-family: var(--mono);
        font-size: 10.5px;
        width: 90px;
        cursor: pointer;
      }
      .ftab.active .fname { cursor: text; width: auto; min-width: 60px; max-width: 140px; }
      .ftab .fclose {
        font-size: 10px;
        color: var(--dim);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
        font-family: var(--mono);
        opacity: 0;
        transition: opacity .1s;
      }
      .ftab:hover .fclose,
      .ftab.active .fclose { opacity: 1; }
      .ftab .fclose:hover { color: var(--red); }
      .ftab-add {
        padding: 0 10px;
        font-size: 14px;
        color: var(--dim);
        cursor: pointer;
        background: none;
        border: none;
        font-family: var(--mono);
        flex-shrink: 0;
        transition: color .1s;
        align-self: center;
      }
      .ftab-add:hover { color: var(--orange); }

      /* ── Editor ──────────────────────────────────────────────────────────── */
      #editor-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg0);
        position: relative;
      }
      /* CodeMirror mount point */
      #cm-editor {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #cm-editor .cm-editor {
        height: 100%;
        background: var(--bg0);
        font-family: var(--mono);
        font-size: 12.5px;
        outline: none;
      }
      #cm-editor .cm-editor.cm-focused { outline: none; }
      #cm-editor .cm-scroller {
        font-family: var(--mono);
        line-height: 1.75;
        overflow: auto;
      }
      #cm-editor .cm-content { padding: 14px 0; caret-color: var(--red); }
      #cm-editor .cm-line { padding: 0 14px; }
      /* Gutter (line numbers) */
      #cm-editor .cm-gutters {
        background: var(--bg0);
        border-right: 1px solid var(--border);
        color: var(--border2);
      }
      #cm-editor .cm-lineNumbers .cm-gutterElement {
        padding: 0 10px 0 6px;
        min-width: 36px;
      }
      /* Cursor */
      #cm-editor .cm-cursor { border-left-color: var(--red); }
      /* Selection */
      #cm-editor .cm-selectionBackground { background: rgba(254,138,17,0.12) !important; }
      #cm-editor .cm-focused .cm-selectionBackground { background: rgba(254,138,17,0.18) !important; }
      /* Active line */
      #cm-editor .cm-activeLine { background: rgba(128,128,128,0.04); }
      #cm-editor .cm-activeLineGutter { background: rgba(128,128,128,0.04); color: var(--dim); }
      /* Bracket matching */
      #cm-editor .cm-matchingBracket { background: rgba(46,196,182,0.15); color: var(--teal) !important; outline: 1px solid rgba(46,196,182,0.3); }
      /* Fold gutter */
      #cm-editor .cm-foldGutter { width: 14px; }
      #cm-editor .cm-foldGutter .cm-gutterElement {
        padding: 0 2px;
        color: var(--border2);
        cursor: pointer;
        font-size: 10px;
        line-height: 1.6;
      }
      #cm-editor .cm-foldGutter .cm-gutterElement:hover { color: var(--orange); }
      #cm-editor .cm-foldPlaceholder {
        background: var(--bg2);
        border: 1px solid var(--border2);
        border-radius: 3px;
        color: var(--dim);
        padding: 0 5px;
        font-size: 10px;
        cursor: pointer;
      }
      #cm-editor .cm-foldPlaceholder:hover { color: var(--orange); border-color: var(--orange); }

      /* ── Syntax tokens — shared base (Mesa & Dark themes) */
      #cm-editor .tok-keyword      { color: var(--pink); }
      #cm-editor .tok-comment      { color: var(--dim); font-style: italic; }
      #cm-editor .tok-string       { color: var(--teal); }
      #cm-editor .tok-number       { color: var(--orange); }
      #cm-editor .tok-operator     { color: var(--muted); }
      #cm-editor .tok-punctuation  { color: var(--dim); }
      #cm-editor .tok-variableName { color: var(--text); }
      #cm-editor .tok-function     { color: var(--orange); }
      #cm-editor .tok-typeName     { color: var(--pink); }
      #cm-editor .tok-tagName      { color: #4a9eff; }
      #cm-editor .tok-attributeName  { color: var(--teal); }
      #cm-editor .tok-attributeValue { color: var(--teal); }
      #cm-editor .tok-angleBracket { color: #4a9eff; }
      #cm-editor .tok-meta         { color: var(--red); }
      #cm-editor .tok-invalid      { color: var(--err); }

      /* Light theme — token overrides for readability on white */
      [data-theme="light"] #cm-editor .cm-selectionBackground { background: rgba(194,94,0,0.12) !important; }
      [data-theme="light"] #cm-editor .cm-focused .cm-selectionBackground { background: rgba(194,94,0,0.2) !important; }
      [data-theme="light"] #cm-editor .tok-tagName      { color: #1d6fb5; }
      [data-theme="light"] #cm-editor .tok-angleBracket { color: #1d6fb5; }
      /* Hidden fallback textarea */
      #editor { display: none !important; }
      #line-nums { display: none !important; }
      #src-view {
        flex: 1;
        background: var(--bg0);
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.75;
        padding: 14px;
        overflow-y: auto;
        display: none;
        white-space: pre;
        position: absolute;
        inset: 0;
      }
      #src-view.active {
        display: block;
      }
      /* CM hidden in view mode */
      #cm-editor.hidden { display: none; }
      #src-legend {
        display: flex;
        flex-shrink: 0;
        padding: 6px 14px;
        border-top: 1px solid var(--border);
        background: var(--bg1);
        font-size: 9.5px;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      #src-legend .legend-item { display: flex; align-items: center; gap: 4px; }
      #src-legend .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
      /* Autocomplete dropdown */
      .cm-tooltip.cm-tooltip-autocomplete {
        background: var(--bg1) !important;
        border: 1px solid var(--border) !important;
        border-radius: 4px !important;
        font-family: var(--mono) !important;
        font-size: 11.5px !important;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4) !important;
      }
      .cm-tooltip-autocomplete ul li {
        padding: 3px 10px !important;
        color: var(--muted) !important;
      }
      .cm-tooltip-autocomplete ul li[aria-selected] {
        background: rgba(254,138,17,0.12) !important;
        color: var(--text) !important;
      }
      .cm-completionLabel { color: var(--text); }
      .cm-completionDetail { color: var(--dim); font-style: italic; margin-left: 8px; }
      .cm-completionIcon { color: var(--orange); }

      /* Vim mode status bar */
      #cm-editor .cm-vim-panel {
        background: var(--bg1);
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        padding: 2px 10px;
      }
      #cm-editor .cm-vim-panel input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: var(--mono);
        font-size: 11px;
        width: 100%;
      }
      .ph .view-toggle {
        background: transparent;

        color: var(--dim);

      #err-strip {

      /* ── Tab bar ─────────────────────────────────────────────────────────── */
      #tab-bar {
        display: flex;
        align-items: stretch;
        height: 34px;
        background: var(--bg1);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .tpip {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--pink);
        align-self: center;
        margin: 0 4px 0 12px;
        flex-shrink: 0;
      }
      #tab-bar .tab {
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--dim);
        font-family: var(--mono);
        font-size: 9px;
        padding: 0 13px;
        height: 100%;
        cursor: pointer;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: all 0.12s;
      }
      #tab-bar .tab.active {
        border-bottom-color: var(--red);
        color: var(--orange);
      }

      /* ── Tab content ─────────────────────────────────────────────────────── */
      /*
       * Every chrome selector below is anchored to an id or a namespaced class,
       * and that is load-bearing, not style.
       *
       * The preview renders INTO this page — a component's markup are siblings
       * of the REPL's own DOM and share one stylesheet. A bare `.panel` rule
       * therefore matches an example's <div class="panel"> too, and this one is
       * `display: none`, so the Slots example (whose Panel.mesa renders exactly
       * that) rendered perfect DOM and showed a blank pane. Nothing threw.
       *
       * Anchor anything generic: `#tab-content > .panel`, not `.panel`.
       */
      #tab-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #tab-content > .panel {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      #tab-content > .panel.active {
        display: flex;
      }

      /* ── Preview ─────────────────────────────────────────────────────────── */
      #pv-status {
        padding: 3px 12px;
        background: var(--pv-hdr-bg);
        border-bottom: 1px solid var(--pv-hdr-bdr);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #pvdot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d1d5db;
        transition: background 0.2s;
      }
      #pvlbl {
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--pv-hdr-lbl);
      }
      #pv-container {
        flex: 1;
        overflow: auto;
        padding: 18px 20px;
        background: var(--pv-bg);
        /* Inherited defaults for the preview, set on the CONTAINER so any
           component rule still wins for its own elements. Without these the
           preview inherits the REPL chrome's purple mono text the moment
           .self-styled turns the base rules off, and an example whose
           component styles only some elements looks broken rather than plain. */
        color: #1e1e2e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }
      /* Preview base styles — deliberately :where(), and skipped entirely
         once the component ships its own CSS (.self-styled).

         Two separate reasons, and the second is not obvious:

         These exist so an example with no <style> block still looks like
         something. But `#pv-container p` is specificity (1,0,1) and a Mesa
         scoped rule is `p.mHASH` — (0,1,1) — so the REPL was overriding every
         component style it had an opinion about: headings, paragraphs, buttons,
         inputs, labels, hr, strong, em. Even with the stylesheet correctly
         injected, `p { color: #6b7280 }` in an example did nothing.

         :where() contributes zero specificity, so each of these is (0,0,1) —
         a plain element selector, which any component rule beats.

         But specificity alone is not enough, because overrides are per
         PROPERTY. The scoped-styles example declares
         `button { background: white; border: 1px solid #d1d5db }` and no
         `color` — so the component won `background` and this block's
         `color: #fff` stayed, painting white text on a white button. Every
         label was invisible. There is no CSS way to ask "did the component
         style this element", so the REPL answers it in JS: if the compile
         produced any CSS at all, the component owns the look and these rules
         sit out. An example with no <style> block still gets them. */
      :where(#pv-container:not(.self-styled)) h1,
      :where(#pv-container:not(.self-styled)) h2,
      :where(#pv-container:not(.self-styled)) h3 {
        margin: 0 0 10px;
        color: #111;
        font-size: 15px;
        font-weight: 600;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      :where(#pv-container:not(.self-styled)) p {
        margin: 0 0 6px;
        color: #1e1e2e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }
      :where(#pv-container:not(.self-styled)) hr {
        border: none;
        border-top: 1px solid #e5e7eb;
        margin: 10px 0;
      }
      :where(#pv-container:not(.self-styled)) label {
        font-size: 12px;
        color: #6b7280;
        font-weight: 500;
        font-family: inherit;
      }
      :where(#pv-container:not(.self-styled)) button {
        background: #1e1e2e;
        color: #fff;
        border: none;
        padding: 5px 13px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        margin: 2px 3px 2px 0;
        font-family: inherit;
        transition: background 0.1s;
      }
      :where(#pv-container:not(.self-styled)) button:hover {
        background: #374151;
      }
      :where(#pv-container:not(.self-styled)) input,
      :where(#pv-container:not(.self-styled)) textarea,
      :where(#pv-container:not(.self-styled)) select {
        border: 1px solid #d1d5db;
        border-radius: 4px;
        padding: 5px 9px;
        font-size: 13px;
        font-family: inherit;
        margin: 2px 3px 2px 0;
        outline: none;
        transition: border-color 0.1s;
      }
      :where(#pv-container:not(.self-styled)) input:focus,
      :where(#pv-container:not(.self-styled)) textarea:focus {
        border-color: #6366f1;
      }
      :where(#pv-container:not(.self-styled)) textarea {
        resize: vertical;
      }
      :where(#pv-container:not(.self-styled)) strong {
        font-weight: 600;
      }
      :where(#pv-container:not(.self-styled)) em {

  </head>

    <script type="importmap">
      {
        "imports": {
          "acorn": "https://esm.sh/acorn@8",
          "astring": "https://esm.sh/astring@1",
          "unified": "https://esm.sh/unified@11",
          "remark-parse": "https://esm.sh/remark-parse@11",
          "remark-gfm": "https://esm.sh/remark-gfm@4",
          "remark-rehype": "https://esm.sh/remark-rehype@11",
          "rehype-slug": "https://esm.sh/rehype-slug@6",
          "rehype-stringify": "https://esm.sh/rehype-stringify@10",
          "@codemirror/state": "https://esm.sh/@codemirror/state@6",
          "@codemirror/view": "https://esm.sh/@codemirror/view@6",
          "@codemirror/language": "https://esm.sh/@codemirror/language@6",
          "@codemirror/commands": "https://esm.sh/@codemirror/commands@6",
          "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6",
          "@codemirror/lang-html": "https://esm.sh/@codemirror/lang-html@6",
          "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6",
          "@lezer/highlight": "https://esm.sh/@lezer/highlight@1",
          "@replit/codemirror-vim": "https://esm.sh/@replit/codemirror-vim@6"
        }
      }
    </script>

    <script type="module">
      // ─── Import real compiler + runtime from local files ─────────────────────────
      import { compile, compileSource } from '../src/compiler.js'
      import * as $rt from '../src/runtime.js'
      import { EXAMPLES, EXAMPLE_GROUPS, DEFAULT_EXAMPLE } from './examples.js'

      // ─── CodeMirror 6 setup ───────────────────────────────────────────────────────
      import { EditorState } from '@codemirror/state'
      import { EditorView, keymap, lineNumbers, highlightActiveLine, highlightActiveLineGutter, drawSelection } from '@codemirror/view'
      import { defaultKeymap, historyKeymap, history, indentWithTab } from '@codemirror/commands'
      import { syntaxHighlighting, defaultHighlightStyle, bracketMatching, indentOnInput, foldGutter, foldKeymap, codeFolding } from '@codemirror/language'
      import { javascript } from '@codemirror/lang-javascript'
      import { html } from '@codemirror/lang-html'
      import { autocompletion, closeBrackets, closeBracketsKeymap, completionKeymap } from '@codemirror/autocomplete'
      import { vim, Vim } from '@replit/codemirror-vim'

      // Mesa token highlight style — maps CM token classes to Mesa colors
      import { HighlightStyle } from '@codemirror/language'
      import { tags } from '@lezer/highlight'

      const mesaHighlight = HighlightStyle.define([
        { tag: tags.keyword,          class: 'tok-keyword' },
        { tag: tags.comment,          class: 'tok-comment' },
        { tag: tags.string,           class: 'tok-string' },
        { tag: tags.number,           class: 'tok-number' },
        { tag: tags.operator,         class: 'tok-operator' },
        { tag: tags.punctuation,      class: 'tok-punctuation' },
        { tag: tags.variableName,     class: 'tok-variableName' },
        { tag: tags.function(tags.variableName), class: 'tok-function' },
        { tag: tags.definition(tags.variableName), class: 'tok-function' },
        { tag: tags.typeName,         class: 'tok-typeName' },
        { tag: tags.tagName,          class: 'tok-tagName' },
        { tag: tags.attributeName,    class: 'tok-attributeName' },
        { tag: tags.attributeValue,   class: 'tok-attributeValue' },
        { tag: tags.angleBracket,     class: 'tok-angleBracket' },
        { tag: tags.meta,             class: 'tok-meta' },
        { tag: tags.invalid,          class: 'tok-invalid' },
        { tag: tags.self,             class: 'tok-keyword' },
        { tag: tags.bool,             class: 'tok-number' },
        { tag: tags.null,             class: 'tok-number' },
        { tag: tags.propertyName,     class: 'tok-attributeName' },
      ])

      // Detect language for a file by extension
      function langForFile(name) {
        if (name.endsWith('.js') || name.endsWith('.ts')) return javascript()
        // .mesa files — HTML parser with embedded JS in <script> blocks
        // Gives HTML tag/attr tab-completion + JS completion in script blocks
        return html({ selfClosingTags: false })
      }

      // Build CM extensions list for a given filename
      let vimEnabled = localStorage.getItem('mesa-vim') === '1'

      function cmExtensions(filename, onUpdate) {
        const exts = [
          history(),
          lineNumbers(),
          foldGutter(),
          codeFolding(),
          highlightActiveLine(),
          highlightActiveLineGutter(),
          drawSelection(),
          closeBrackets(),
          bracketMatching(),
          indentOnInput(),
          autocompletion(),
          syntaxHighlighting(mesaHighlight),
          langForFile(filename),
          EditorView.updateListener.of((update) => {
            if (update.docChanged) onUpdate(update.state.doc.toString())
          }),
          keymap.of([
            ...closeBracketsKeymap,
            ...completionKeymap,
            ...defaultKeymap,
            ...historyKeymap,
            ...foldKeymap,
            indentWithTab,
            {
              key: 'Mod-Enter',
              run: () => {
                scheduleCompile(getEditorValue())
                return true
              }
            }
          ]),
          EditorView.theme({
            '&': { height: '100%' },
            '.cm-scroller': { overflow: 'auto' }
          }),
        ]
        if (vimEnabled) exts.unshift(vim())
        return exts
      }

      // Create the CM editor
      const cmMount = document.getElementById('cm-editor')
      let cmView = null
      let cmFallback = false  // true if CM failed to load

      function initCMEditor(initialContent, filename) {
        if (cmView) { cmView.destroy(); cmView = null }
        try {
          const state = EditorState.create({
            doc: initialContent,
            extensions: cmExtensions(filename, (newContent) => {
              files[activeFileIdx].content = newContent
              if (activeFileIdx === 0) scheduleCompile(newContent)
              else scheduleCompile(files[0].content)
              // Dim the group bar when user edits — they've diverged from the example
              document.getElementById('group-bar')?.classList.add('edited')
            })
          })
          cmView = new EditorView({ state, parent: cmMount })
        } catch(e) {
          console.warn('[Mesa REPL] CodeMirror init failed, falling back to textarea:', e)
          cmFallback = true
          cmMount.style.display = 'none'
          document.getElementById('editor').style.display = ''
        }
      }

      // Value accessor — works regardless of CM or fallback mode
      function getEditorValue() {
        if (cmFallback) return document.getElementById('editor').value
        return cmView?.state.doc.toString() ?? ''
      }

      function setEditorValue(content, filename) {
        if (cmFallback) {
          const ta = document.getElementById('editor')
          ta.value = content
          return
        }
        if (!cmView || filename !== (cmView._mesaFilename ?? '')) {
          // Reinit with new language if filename changed
          if (cmView) cmView._mesaFilename = filename
          initCMEditor(content, filename)
          if (cmView) cmView._mesaFilename = filename
          return
        }
        // Same file — just replace content
        cmView.dispatch({
          changes: { from: 0, to: cmView.state.doc.length, insert: content }
        })
      }

      // ─── Examples drawer ──────────────────────────────────────────────────────────

      let activeExample = 'counter'
      const exDrawer   = document.getElementById('ex-drawer')
      const exBackdrop = document.getElementById('ex-backdrop')
      let drawerOpen = false

      function keyToLabel(key) {
        return key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase()).trim()
      }

      function openDrawer() {
        exDrawer.classList.add('open')
        exBackdrop.classList.add('open')
        drawerOpen = true
        // Focus search and highlight active example
        const search = document.getElementById('ex-search')
        if (search) { search.value = ''; filterDrawer(''); setTimeout(() => search.focus(), 50) }
        document.querySelectorAll('.ex-item').forEach(el => {
          el.classList.toggle('active', el.dataset.key === activeExample)
        })
      }

      function closeDrawer() {
        exDrawer.classList.remove('open')
        exBackdrop.classList.remove('open')
        drawerOpen = false
      }

      function filterDrawer(q) {
        const query = q.toLowerCase().trim()
        document.querySelectorAll('.ex-group').forEach(group => {
          let visibleCount = 0
          group.querySelectorAll('.ex-item').forEach(item => {
            const name = item.querySelector('.ex-item-name')?.textContent.toLowerCase() || ''
            const file = item.querySelector('.ex-item-file')?.textContent.toLowerCase() || ''
            const groupName = group.querySelector('.ex-group-name')?.textContent.toLowerCase() || ''
            const match = !query || name.includes(query) || file.includes(query) || groupName.includes(query)
            item.style.display = match ? '' : 'none'
            if (match) visibleCount++
          })
          // Show/hide group based on whether any items match
          group.style.display = visibleCount === 0 ? 'none' : ''
          // Auto-expand groups when searching
          if (query) group.classList.remove('collapsed')
        })
      }

      function buildDrawer() {
        const body = document.getElementById('ex-drawer-body')
        body.innerHTML = ''

        for (const [groupName, items] of Object.entries(EXAMPLE_GROUPS)) {
          const group = document.createElement('div')
          group.className = 'ex-group'

          const hdr = document.createElement('div')
          hdr.className = 'ex-group-hdr'
          hdr.innerHTML = `
            <span class="ex-group-chevron">▾</span>
            <span class="ex-group-name">${groupName}</span>
            <span class="ex-group-count">${items.length}</span>
          `
          hdr.addEventListener('click', () => {
            group.classList.toggle('collapsed')
          })

          const itemsEl = document.createElement('div')
          itemsEl.className = 'ex-group-items'

          for (const ex of items) {
            const item = document.createElement('div')
            item.className = 'ex-item'
            item.dataset.key = ex.key
            if (ex.key === activeExample) item.classList.add('active')

            item.innerHTML = `
              <span class="ex-item-name">${ex.label ?? keyToLabel(ex.key)}</span>
              <span class="ex-item-file">${ex.file}</span>
            `
            item.addEventListener('click', () => {
              loadExample(ex.key)
              closeDrawer()
            })
            itemsEl.appendChild(item)
          }

          group.appendChild(hdr)
          group.appendChild(itemsEl)
          body.appendChild(group)
        }
      }

      buildDrawer()

      document.getElementById('ex-btn').addEventListener('click', openDrawer)
      document.getElementById('ex-drawer-close').addEventListener('click', closeDrawer)
      exBackdrop.addEventListener('click', closeDrawer)
      document.getElementById('ex-search').addEventListener('input', (e) => filterDrawer(e.target.value))
      document.getElementById('ex-search').addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); closeDrawer() }
        // Enter on single visible result — load it
        if (e.key === 'Enter') {
          const visible = [...document.querySelectorAll('.ex-item')].filter(el => el.style.display !== 'none')
          if (visible.length === 1) { loadExample(visible[0].dataset.key); closeDrawer() }
        }
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && drawerOpen) closeDrawer()
      })

      // ─── Helpers ──────────────────────────────────────────────────────────────────

      function execCompiled(js, userImports = {}) {
        const names = [],
          vals = []
        const re = /^import\s+(.+?)\s+from\s+'([^']+)';$/gm
        let m
        while ((m = re.exec(js)) !== null) {
          const spec = m[1].trim(),
            src = m[2]
          if (src === '@frontierjs/mesa/runtime.js') continue
          const mock = userImports[src] || {}
          if (spec.startsWith('* as ')) {
            // import * as Foo from '...'
            names.push(spec.slice(5).trim())
            vals.push(mock)
          } else if (spec.startsWith('{')) {
            // import { foo, bar as baz } from '...'
            const inner = spec.replace(/^\{|\}$/g, '').trim()
            inner.split(',').forEach((b) => {
              const [o, a] = b.trim().split(/\s+as\s+/)
              names.push((a || o).trim())
              vals.push(mock[o.trim()])
            })
          } else if (spec.includes(',')) {
            // import Def, { foo } from '...'  (default + named)
            const [defPart, namedPart] = spec.split(/,\s*\{/)
            names.push(defPart.trim())
            vals.push(mock['default'])
            if (namedPart) {
              namedPart.replace('}', '').split(',').forEach((b) => {
                const [o, a] = b.trim().split(/\s+as\s+/)
                names.push((a || o).trim())
                vals.push(mock[o.trim()])
              })
            }
          } else {
            // import Foo from '...'  — default import
            names.push(spec)
            vals.push(mock['default'])
          }
        }
        // Strip imports; expose component as __component (not return) so
        // module-level $$delegate calls and template consts also run.
        let code = js.replace(/^import\s+.+?from\s+'[^']+';$/gm, '').trim()
        code = code.replace(/^export default\s+/m, 'const __component = ')
        // Strip 'export' keyword from named exports in <script module> —
        // new Function() doesn't allow export declarations.
        code = code.replace(/^(\s*)export (function|class|const|let|var) /gm, '$1$2 ')
        code += '\nreturn __component'
        // eslint-disable-next-line no-new-func
        return new Function('$runtime', ...names, code)($rt, ...vals)
      }

      // ─── Multi-file state ─────────────────────────────────────────────────────────
      // files[0] is always the main component (.mesa). Extra files are plain JS
      // (stores, utils) that get passed as userImports when mounting.
      let files = [{ name: 'Counter.mesa', content: '' }]
      let activeFileIdx = 0
      let currentInstance = null
      let debTimer = null
      let compiledJS = ''

      // ─── Preview stylesheets ──────────────────────────────────────────────────────
      //
      // Every compile here passes `css: false`, which tells the compiler NOT to
      // emit a `$runtime.addStyles(...)` call and to hand the scoped CSS back on
      // `ctx.css.result` instead. Nothing collected it, so from the day scoped CSS
      // landed the REPL applied the scope class to every element and injected no
      // rules to match it — the twelve examples with a <style> block rendered
      // completely unstyled, while their compiled output looked correct.
      //
      // `css: false` is still the right option: `addStyles` writes to
      // document.head and mount().destroy() only reclaims styles for a ShadowRoot
      // root, so letting the compiler inject would leak every example's rules —
      // `:global(...)` included — into every example you looked at afterwards.
      // The REPL owns the tags instead, and drops them on teardown.
      const previewStyles = {
        els: [],
        add(id, css) {
          if (!css || this.els.some((el) => el.id === id)) return
          const el = document.createElement('style')
          el.id = id                        // content-addressed scope id
          el.textContent = css
          document.head.appendChild(el)
          this.els.push(el)
          // A component that styles itself owns its look — see .self-styled
          // in the preview base styles.
          document.getElementById('pv-container')?.classList.add('self-styled')
        },
        clear() {
          this.els.forEach((el) => el.remove())
          this.els = []
          document.getElementById('pv-container')?.classList.remove('self-styled')
        }
      }

      // ─── @ui/ — the real @frontierjs/ui package, loaded live ──────────────────────
      //
      // `@ui/forms/Button.mesa` → packages/ui/components/forms/Button.mesa.
      // That is a SIBLING of this package, so it is only reachable when the
      // server root is the monorepo root — which is what `npm run serve` does.
      // Before this the REPL fetched `./ui/<name>`, a directory that was
      // deleted when `ui-v2/` became `packages/ui`, so every import 404'd and
      // the showcase died with "Card is not a function".
      //
      // A single flat fetch is not enough: a real component has its own module
      // graph (`./Field.mesa`, `../../utils.js`). This resolves relative
      // specifiers against the importing file and loads recursively.
      const UI_ROOT = '../../ui/'
      const uiCache = new Map()

      const uiSpecToUrl = (spec, from = location.href) =>
        new URL(spec.startsWith('@ui/')
          ? UI_ROOT + 'components/' + spec.slice('@ui/'.length)
          : spec, from)

      async function loadUiModule(url) {
        const key = url.href
        if (uiCache.has(key)) return uiCache.get(key)
        const pending = (async () => {
          // A plain .js dependency is a real ES module the browser can load
          // itself — no export-stripping, and it brings its own dep graph.
          if (!key.endsWith('.mesa')) return await import(/* @vite-ignore */ key)

          const res = await fetch(key)
          if (!res.ok) throw new Error(`HTTP ${res.status} for ${key}`)
          const src = await res.text()
          const name = key.slice(key.lastIndexOf('/') + 1)
          const ctx = await compileSource(src, { filename: name, css: false, debug: false })
          if (ctx.analysis?.errors?.length) throw new Error(`${name}: ${ctx.analysis.errors[0]}`)
          previewStyles.add(ctx.css?.id, ctx.css?.result)

          // Resolve this module's own imports before instantiating it.
          const deps = {}
          const re = /^import\s+.+?from\s+'([^']+)';$/gm
          let m
          while ((m = re.exec(ctx.result)) !== null) {
            const spec = m[1]
            if (spec === '@frontierjs/mesa/runtime.js') continue
            deps[spec] = await loadUiModule(uiSpecToUrl(spec, url))
          }
          return { default: execCompiled(ctx.result, deps) }
        })()
        // Cache the promise, not the result: a diamond dependency (two
        // components importing Field.mesa) must not compile it twice.
        uiCache.set(key, pending)
        return pending
      }

      const editor = document.getElementById('editor')
      const lineNums = document.getElementById('line-nums')

      // ─── File tab rendering ───────────────────────────────────────────────────────
      function renderFileTabs() {
        const bar = document.getElementById('file-tabs')
        bar.innerHTML = ''
        files.forEach((f, i) => {
          const tab = document.createElement('button')
          tab.className = 'ftab' + (i === activeFileIdx ? ' active' : '')

          const nameEl = document.createElement('input')
          nameEl.className = 'fname'
          nameEl.value = f.name
          nameEl.readOnly = false  // always editable when active; click on inactive switches first
          nameEl.spellcheck = false
          nameEl.addEventListener('mousedown', (e) => {
            if (i !== activeFileIdx) {
              e.preventDefault()
              switchToFile(i)
              // Focus the name input after switching so user can immediately rename
              setTimeout(() => { nameEl.focus(); nameEl.select() }, 10)
            }
          })
          nameEl.addEventListener('change', () => {
            const v = nameEl.value.trim()
            if (v) files[i].name = v
            scheduleCompile(files[0].content)
          })
          nameEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { nameEl.blur(); e.preventDefault() }
            e.stopPropagation()
          })
          nameEl.addEventListener('click', (e) => e.stopPropagation())

          const closeBtn = document.createElement('button')
          closeBtn.className = 'fclose'
          closeBtn.textContent = '×'
          closeBtn.title = 'Remove file'
          closeBtn.addEventListener('click', (e) => {
            e.stopPropagation()
            if (files.length <= 1) return
            files.splice(i, 1)
            if (activeFileIdx >= files.length) activeFileIdx = files.length - 1
            renderFileTabs()
            setEditorValue(files[activeFileIdx].content, files[activeFileIdx].name)
            scheduleCompile(files[0].content)
          })

          tab.appendChild(nameEl)
          if (i > 0) tab.appendChild(closeBtn)
          tab.addEventListener('click', () => { if (i !== activeFileIdx) switchToFile(i) })
          bar.appendChild(tab)
        })

        const addBtn = document.createElement('button')
        addBtn.className = 'ftab-add'
        addBtn.textContent = '+'
        addBtn.title = 'Add file'
        addBtn.addEventListener('click', () => {
          const mesaFiles = files.filter(f => f.name.endsWith('.mesa'))
          const jsFiles   = files.filter(f => f.name.endsWith('.js'))
          // Default: next .mesa component or store.js
          const name = mesaFiles.length === 1 ? 'Btn.mesa' :
                       jsFiles.length === 0   ? 'store.js' : `file${jsFiles.length + 1}.js`
          const content = name.endsWith('.mesa')
            ? '<script>\n  export let label = \'Button\'\n</' + 'script>\n\n<button>{label}</' + 'button>\n'
            : '// ' + name + '\nexport const store = {}\n'
          files.push({ name, content })
          switchToFile(files.length - 1)
          // Auto-select the filename so user can rename immediately
          setTimeout(() => {
            const inputs = document.querySelectorAll('#file-tabs .fname')
            const last = inputs[inputs.length - 1]
            if (last) { last.focus(); last.select() }
          }, 20)
        })
        bar.appendChild(addBtn)
      }

      function switchToFile(idx) {
        files[activeFileIdx].content = getEditorValue()
        activeFileIdx = idx
        setEditorValue(files[idx].content, files[idx].name)
        renderFileTabs()
        if (idx === 0) scheduleCompile(files[0].content)
      }

      // ─── Evaluate / compile extra files for userImports ───────────────────────────
      async function evalExtraFile(file, allUserImports) {
        const { name, content } = file
        // .mesa files — compile then execCompiled, expose as default export (the component fn)
        if (name.endsWith('.mesa')) {
          try {
            const ctx = await compileSource(content, { filename: name, css: false, debug: false })
            previewStyles.add(ctx.css?.id, ctx.css?.result)
            const componentFn = execCompiled(ctx.result, allUserImports)
            return { default: componentFn }
          } catch(e) {
            console.warn(`[Mesa REPL] Error compiling ${name}:`, e.message)
            return {}
          }
        }
        // Plain .js — strip export keywords, collect named exports via Function()
        const namedRe = /^export\s+(const|let|var)\s+(\w+)\s*=/gm
        const fnRe    = /^export\s+function\s+(\w+)/gm
        const names = [], fnNames = []
        let m
        while ((m = namedRe.exec(content)) !== null) names.push(m[2])
        while ((m = fnRe.exec(content))    !== null) fnNames.push(m[1])
        let code = content
          .replace(/^export\s+default\s+/mg,               'var __default = ')
          .replace(/^export\s+(const|let|var|function|class)\s+/mg, '$1 ')
        code += '\n'
        names.forEach(n   => { code += `if(typeof ${n}!=='undefined') __exports.${n}=${n};\n` })
        fnNames.forEach(n => { code += `if(typeof ${n}!=='undefined') __exports.${n}=${n};\n` })
        code += 'if(typeof __default!=="undefined") __exports.default=__default;\n'
        const exports = {}
        try { new Function('__exports', code)(exports) }
        catch(e) { console.warn(`[Mesa REPL] Error in ${name}:`, e.message) }
        return exports
      }

      // ─── UI helpers ───────────────────────────────────────────────────────────────
      function setStatus(color, msg) {
        const colors = { green: '#22c55e', orange: '#fe8a11', red: '#D93025', dim: '#545470' }
        const c = colors[color] || '#545470'
        document.getElementById('sdot').style.background = c
        document.getElementById('smsg').style.color = c
        document.getElementById('smsg').textContent = msg
      }

      function setPvStatus(state) {
        const c =
          { ok: '#22c55e', error: '#ef4444', compiling: '#fc680a' }[state] || '#d1d5db'
        document.getElementById('pvdot').style.background = c
        document.getElementById('pvlbl').textContent =
          { ok: 'running', error: 'error', compiling: 'compiling…' }[state] || ''
      }

      function updateLineNums() { /* no-op — CM handles line numbers */ }

      function renderGroupBar(activeName) {
        const bar = document.getElementById('group-bar')
        const ex = EXAMPLES[activeName]
        if (!ex) { bar.classList.remove('visible'); return }

        const group = ex.group
        const siblings = EXAMPLE_GROUPS[group] || []
        if (siblings.length <= 1) { bar.classList.remove('visible'); return }

        bar.innerHTML = ''
        // Group label
        const lbl = document.createElement('span')
        lbl.className = 'gbar-label'
        lbl.textContent = group
        bar.appendChild(lbl)

        // Sibling pills
        for (const sib of siblings) {
          const pill = document.createElement('span')
          pill.className = 'gbar-item' + (sib.key === activeName ? ' active' : '')
          pill.textContent = keyToLabel(sib.key)
          pill.addEventListener('click', () => {
            if (sib.key !== activeExample) loadExample(sib.key)
          })
          bar.appendChild(pill)
        }

        bar.classList.add('visible')
        bar.classList.remove('edited')
        // Scroll active pill into view
        const activePill = bar.querySelector('.gbar-item.active')
        if (activePill) activePill.scrollIntoView({ inline: 'nearest', block: 'nearest' })
      }

      function loadExample(name) {
        const ex = EXAMPLES[name]
        if (!ex) return
        activeExample = name
        // Reset to single file
        // An example may ship extra files — a child component, a store module.
        // They become editor tabs and resolve as './Name.mesa' / './name.js'
        // imports through evalExtraFile, same as files the user adds by hand.
        files = [{ name: ex.file, content: ex.src }, ...(ex.files ?? [])]
        activeFileIdx = 0
        setEditorValue(ex.src, ex.file)
        renderFileTabs()
        renderGroupBar(name)
        if (typeof setViewMode === 'function') setViewMode(false)
        scheduleCompile(ex.src)
        // Sync drawer active highlight
        document.querySelectorAll('.ex-item').forEach(el => {
          el.classList.toggle('active', el.dataset.key === name)
        })
        // Clear URL hash so the example loads fresh on next visit
        window.history.replaceState(null, '', location.pathname + location.search)
      }

      // ─── Compilation ──────────────────────────────────────────────────────────────
      async function runCompile(src) {
        setStatus('orange', 'Compiling…')
        setPvStatus('compiling')

        try {
          const filename = files[0].name || 'Component.mesa'
          const ctx = await compileSource(src, { debug: false, css: false, filename })
          compiledJS = ctx.result
          const analysis = ctx.analysis
          const errs  = analysis?.errors   || []
          const warns = analysis?.warnings || []

          // Error / warning strip
          const strip = document.getElementById('err-strip')
          if (errs.length || warns.length) {
            strip.innerHTML = [
              ...errs.map((e) => `<div class="err-line">⬡ ${e}</div>`),
              ...warns.map((w) => `<div class="warn-line">⚠ ${w}</div>`)
            ].join('')
            strip.style.display = 'block'
          } else {
            strip.style.display = 'none'
          }

          setStatus(
            errs.length  ? 'red'    :
            warns.length ? 'orange' : 'green',
            errs.length  ? `${errs.length} error(s)` :
            warns.length ? `${warns.length} warning(s)` : 'OK ✓'
          )

          // Destroy previous component
          if (currentInstance) {
            try { currentInstance.destroy() } catch (_) {}
            currentInstance = null
          }

          // The previous example's stylesheets are gone with it, so this one's
          // go in now — before mount, and before the imported components below
          // add theirs.
          previewStyles.clear()
          previewStyles.add(ctx.css?.id, ctx.css?.result)

          // Build userImports from extra files (store.js, Btn.mesa, etc.)
          // Compile in order so later files can import from earlier ones.
          const userImports = {}
          for (const f of files.slice(1)) {
            const exports = await evalExtraFile(f, userImports)
            const specifiers = ['./' + f.name, '../' + f.name, f.name]
            specifiers.forEach(s => { userImports[s] = exports })
          }

          // Resolve @ui/ imports against the real `@frontierjs/ui` package.
          // This needs the monorepo root as the server root — see `npm run
          // serve`. Fetches are per-compile so a component's styles are
          // re-added after previewStyles.clear(); the browser's HTTP cache
          // makes the repeat cost nothing.
          uiCache.clear()
          const uiImportRe = /from\s+'(@ui\/[^']+)'/g
          const uiMatches = new Set()
          let uim
          while ((uim = uiImportRe.exec(compiledJS)) !== null) uiMatches.add(uim[1])
          for (const spec of uiMatches) {
            if (userImports[spec]) continue  // already resolved
            try {
              userImports[spec] = await loadUiModule(uiSpecToUrl(spec))
              // The design system owns the look. frontier.css is fully layered,
              // so the preview's unlayered base rules would beat every one of
              // its component classes — see `.self-styled`.
              document.getElementById('pv-container')?.classList.add('self-styled')
            } catch(e) {
              console.warn(
                `[Mesa REPL] Could not load ${spec}: ${e.message}\n` +
                `  @ui/ resolves to packages/ui, which is OUTSIDE this package — ` +
                `run \`npm run serve\` (it serves the monorepo root) and open ` +
                `/packages/mesa/example/.`)
              userImports[spec] = {}
            }
          }

          // Mount new component.
          //
          // Through mount(), not by calling the component directly. Delegation
          // roots are registered by mount() alone, and $$delegate() only wires
          // event types to roots that are already registered — so a hand-rolled
          // `componentFn(anchor, {}, null)` produces a preview that renders
          // perfectly and responds to nothing. Every button in every example was
          // dead from the day per-mount delegation replaced document.body.
          //
          // createRoot() owns the whole instance so switching examples disposes
          // its effects. The old teardown cleared innerHTML and flushed, which
          // removes the DOM and leaves the reactive graph behind — every example
          // you clicked through stayed subscribed for the life of the page.
          const container = document.getElementById('pv-container')
          container.innerHTML = ''
          try {
            const componentFn = execCompiled(compiledJS, userImports)
            const label = document.createElement('span')
            label.style.display = 'none'
            container.appendChild(label)
            $rt.flushSync()

            let instance, disposeRoot
            $rt.createRoot((dispose) => {
              disposeRoot = dispose
              instance = $rt.mount(label, componentFn, { props: {}, root: container })
              $rt.flushSync()
            })

            currentInstance = {
              destroy() {
                try { disposeRoot?.() } catch (_) {}      // effects first
                try { instance?.destroy() } catch (_) {}  // then delegation
                try { $rt.flushSync() } catch (_) {}
                container.innerHTML = ''
                previewStyles.clear()                     // then this example's CSS
              }
            }
            setPvStatus('ok')
          } catch (e) {
            const div = document.createElement('div')
            div.className = 'mesa-error'
            div.textContent = 'Runtime error:\n' + e.message
            container.appendChild(div)
            setPvStatus('error')
            console.error('[Mesa REPL] Runtime error:', e)
          }

          // Update output panel
          renderOutput(compiledJS)
          renderGraph(analysis)
          renderAnalysis(analysis, ctx.DOM)
          window.__lastMesaAnalysis = { ...analysis, rootFunctions: ctx.script?.rootFunctions }  // used by renderSrcView
          if (isViewing) renderSrcView(files[0].content)
          document.getElementById('output-stats').textContent = `${
            compiledJS.split('\n').length
          } lines · ${compiledJS.length} chars`
        } catch (e) {
          setStatus('red', e.message.slice(0, 80))
          setPvStatus('error')
          console.error('[Mesa REPL] Compile error:', e)
        }
      }

      function scheduleCompile(src) {
        clearTimeout(debTimer)
        debTimer = setTimeout(() => runCompile(src), 250)
      }

      // ─── Output syntax highlight ──────────────────────────────────────────────────
      const KEYWORDS = new Set([
        'const',
        'let',
        'var',
        'function',
        'async',
        'await',
        'return',
        'if',
        'else',
        'for',
        'while',
        'try',
        'catch',
        'throw',
        'new',
        'import',
        'export',
        'default',
        'class',
        'this',
        'typeof',
        'void',
        'in',
        'of'
      ])

      function tokenize(code) {
        const tokens = []
        let rest = code
        const P = [
          [/^\/\/[^\n]*/, '#4a5568'],
          [/^`(?:[^`\\]|\\.)*`/, '#48bb78'],
          [/^'(?:[^'\\]|\\.)*'/, '#48bb78'],
          [/^"(?:[^"\\]|\\.)*"/, '#48bb78'],
          [/^\$\$[\w]+/, '#fc680a'],
          [/^\$runtime/, '#ee380d'],
          [/^[\w$]+/, null],
          [/^-?\d+(?:\.\d+)?/, '#e2b96f'],
          [/^\n/, '__nl'],
          [/^./, '#666']
        ]
        while (rest.length) {
          let hit = false
          for (const [re, col] of P) {
            const m = rest.match(re)
            if (m) {
              const c = col === null ? (KEYWORDS.has(m[0]) ? '#6699cc' : '#C49A84') : col
              tokens.push({ t: m[0], c })
              rest = rest.slice(m[0].length)
              hit = true
              break
            }
          }
          if (!hit) {
            tokens.push({ t: rest[0], c: '#C49A84' })
            rest = rest.slice(1)
          }
        }
        return tokens
      }

      function renderOutput(code) {
        const tokens = tokenize(code)
        const lines = [[]]
        for (const tok of tokens) {
          if (tok.c === '__nl') {
            lines.push([])
            continue
          }
          lines[lines.length - 1].push(tok)
        }
        const html = lines
          .map((line, i) => {
            const cells = line
              .map(
                (tok) =>
                  `<span style="color:${tok.c}">${tok.t
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')}</span>`
              )
              .join('')
            return `<tr>
      <td style="padding:0 12px;text-align:right;color:#241610;font-size:10.5px;user-select:none;white-space:nowrap;min-width:36px;vertical-align:top">${
        i + 1
      }</td>
      <td style="padding:0 16px 0 0;white-space:pre;font-size:12px;vertical-align:top;font-family:var(--mono)">${
        cells || '&nbsp;'
      }</td>
    </tr>`
          })
          .join('')
        document.getElementById(
          'output-inner'
        ).innerHTML = `<table style="border-collapse:collapse;width:100%;line-height:1.7"><tbody>${html}</tbody></table>`
      }

      // ─── Reactive graph ───────────────────────────────────────────────────────────

      const KW_COLORS = { let: '#fe8a11', const: '#2EC4B6', var: '#fc680a' }

      // Four orthogonal label groups, each with an icon, ordered labels, and per-label colors.
      const LABEL_GROUPS = [
        {
          id: 'mutability', label: 'Mutability', icon: '⊡',
          labels: ['mutable', 'immutable'],
          colors: {
            //                 bright ↔ dark within orange family
            mutable:   ['#fe8a11', 'rgba(254,138,17,.14)'],   // orange bright — live, changeable
            immutable: ['#7a420a', 'rgba(122,66,10,.18)'],    // orange dark   — fixed, settled
          }
        },
        {
          id: 'async', label: 'Async', icon: '◎',
          labels: ['async', 'sync'],
          colors: {
            //                 bright ↔ dark within pink family
            async: ['#e8407a', 'rgba(232,64,122,.14)'],       // pink bright   — hot, concurrent
            sync:  ['#6b1f3c', 'rgba(107,31,60,.18)'],        // pink dark     — quiet, settled
          }
        },
        {
          id: 'effects', label: 'Effects', icon: '$:',
          labels: ['watch', 'auto-tracked', 'hard', 'soft'],
          colors: {
            //                 bright ↔ dark within teal family (watch pair)
            'watch':        ['#2ec4b6', 'rgba(46,196,182,.14)'],  // teal bright   — explicit, active
            'auto-tracked': ['#0d5c54', 'rgba(13,92,84,.18)'],    // teal dark     — passive, ambient
            //                 bright ↔ dark within red family (strictness pair)
            'hard':         ['#ee380d', 'rgba(238,56,13,.14)'],   // red bright    — strict, required
            'soft':         ['#5c1a0a', 'rgba(92,26,10,.18)'],    // red dark      — lenient, optional
          }
        },
        {
          id: 'reactivity', label: 'Reactivity', icon: '◈',
          labels: ['reactive', 'derived', 'static'],
          colors: {
            reactive: ['#c084fc', 'rgba(192,132,252,.14)'],
            derived:  ['#7c3aed', 'rgba(124,58,237,.14)'],
            static:   ['#2e1a4a', 'rgba(46,26,74,.18)'],
          }
        },
        {
          id: 'context', label: 'Context', icon: '⬡',
          labels: ['provide', 'consume'],
          colors: {
            provide: ['#34d399', 'rgba(52,211,153,.14)'],   // green — outward
            consume: ['#065f46', 'rgba(6,95,70,.18)'],      // dark green — inward
          }
        },
      ]

      // Flat label → [color, bg] lookup
      const LABEL_COLORS = {}
      for (const g of LABEL_GROUPS) Object.assign(LABEL_COLORS, g.colors)

      function getVarLabels(v) {
        const out = []
        // Mutability first
        out.push(v.kind === 'const' ? 'immutable' : 'mutable')
        // Async — always show sync or async
        out.push(v.isAsync ? 'async' : 'sync')
        // Reactivity last — so it sits right next to the ← dep arrow
        if (v.kind === 'var') out.push('static')
        else if (v.kind === 'const' && !v.isDerived && !v.isAsync) out.push('static')
        else if (v.kind === 'const') out.push('derived')
        else if (v.isWritableDerived) out.push('derived')
        else out.push('reactive')
        return out
      }

      function mkBadge(label) {
        const [color, bg] = LABEL_COLORS[label] || ['#888', 'rgba(128,128,128,.1)']
        return `<span class="g-badge" style="background:${bg};color:${color}">${label}</span>`
      }

      let graphActiveFilters = new Set()

      function applyGraphFilter() {
        document.querySelectorAll('#graph-inner .g-row').forEach((row) => {
          if (!graphActiveFilters.size) { row.style.opacity = ''; return }
          const rowLabels = (row.dataset.labels || '').split('|').filter(Boolean)
          row.style.opacity = rowLabels.some((l) => graphActiveFilters.has(l)) ? '1' : '0.12'
        })
      }

      function renderGraphFilter(presentLabels) {
        const bar = document.getElementById('graph-filter')
        if (!presentLabels.size) { bar.innerHTML = ''; return }

        const allActive = graphActiveFilters.size === 0
        let html = `<span class="gf-pill${allActive ? ' active' : ''}" data-filter="__all__"
          style="color:var(--muted);background:rgba(255,255,255,.04)">all</span>`

        for (const group of LABEL_GROUPS) {
          const groupLabels = group.labels.filter((l) => presentLabels.has(l))
          if (!groupLabels.length) continue
          html += `<span style="display:inline-flex;align-items:center;gap:4px;margin-left:8px">`
          html += `<span style="font-size:8px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;user-select:none">${group.icon} ${group.label}</span>`
          for (const label of groupLabels) {
            const [color, bg] = LABEL_COLORS[label] || ['#888', 'rgba(128,128,128,.1)']
            const active = graphActiveFilters.has(label)
            html += `<span class="gf-pill${active ? ' active' : ''}" data-filter="${label}" style="color:${color};background:${bg}">${label}</span>`
          }
          html += `</span>`
        }
        bar.innerHTML = html

        bar.querySelectorAll('.gf-pill').forEach((pill) => {
          pill.addEventListener('click', () => {
            const f = pill.dataset.filter
            if (f === '__all__') graphActiveFilters.clear()
            else if (graphActiveFilters.has(f)) graphActiveFilters.delete(f)
            else graphActiveFilters.add(f)
            renderGraphFilter(presentLabels)
            applyGraphFilter()
          })
        })
      }

      function renderGraph(analysis) {
        if (!analysis) return
        const {
          vars = {}, watchPaths = [], watchHandlers = [],
          effects = [], errors = [], warnings = [],
          contextProvides = []
        } = analysis

        graphActiveFilters.clear()
        const presentLabels = new Set()
        let html = ''

        if (errors.length) {
          html += errors.map((e) =>
            `<div style="font-size:11px;color:var(--err);padding:4px 0">⬡ ${e}</div>`
          ).join('')
        }

        if (warnings.length) {
          html += warnings.map((w) =>
            `<div style="font-size:11px;color:var(--orange);padding:4px 0">⚠ ${w}</div>`
          ).join('')
        }

        const varArr   = Object.values(vars)
        const propArr  = varArr.filter((v) => v.isProp && !v.isContextConsume)
        const localArr = varArr.filter((v) => !v.isProp && !v.isContextConsume)
        const ctxConsumeArr = varArr.filter((v) => v.isContextConsume)

        // ── Props section ──────────────────────────────────────────────────────
        if (propArr.length) {
          html += `<div class="g-section">Props</div>`
          html += propArr.map((v) => {
            const labels = getVarLabels(v)
            labels.forEach((l) => presentLabels.add(l))
            const deps = v.deps?.length
              ? `<span class="g-deps">← <em>${v.deps.join(', ')}</em></span>` : ''
            const badges = labels.map(mkBadge).join('')
            return `<div class="g-row" data-labels="${labels.join('|')}">
  <span style="color:${KW_COLORS[v.kind]||'#888'};font-size:11px;min-width:40px">${v.kind}</span>
  <span style="color:var(--text);font-size:11px;min-width:90px">${v.name}</span>
  ${badges}${deps}
</div>`
          }).join('')
        }

        // ── Variables section ──────────────────────────────────────────────────
        if (localArr.length) {
          html += `<div class="g-section"${propArr.length ? ' style="margin-top:10px"' : ''}>Variables</div>`
          html += localArr.map((v) => {
            const labels = getVarLabels(v)
            labels.forEach((l) => presentLabels.add(l))
            const deps = v.deps?.length
              ? `<span class="g-deps">← <em>${v.deps.join(', ')}</em></span>` : ''
            const badges = labels.map(mkBadge).join('')
            const kwLabel = v.isWritableDerived ? '$:' : v.kind
            const kwColor = v.isWritableDerived ? 'var(--dim)' : (KW_COLORS[v.kind] || '#888')
            return `<div class="g-row" data-labels="${labels.join('|')}">
  <span style="color:${kwColor};font-size:11px;min-width:40px">${kwLabel}</span>
  <span style="color:var(--text);font-size:11px;min-width:90px">${v.name}</span>
  ${badges}${deps}
</div>`
          }).join('')
        }

        // ── $context section ───────────────────────────────────────────────────
        const hasContext = contextProvides.length || ctxConsumeArr.length
        if (hasContext) {
          html += `<div class="g-section" style="margin-top:10px">$context</div>`
          // Provides
          html += contextProvides.map((p) => {
            presentLabels.add('provide')
            const expr = (p.initRaw || '').slice(0, 30)
            return `<div class="g-row" data-labels="provide">
  <span style="color:var(--dim);font-size:11px;min-width:40px">$ctx</span>
  <span style="color:var(--text);font-size:11px;min-width:90px">.${p.key}</span>
  ${mkBadge('provide')}
  <span class="g-deps">= <em>${expr}${p.initRaw?.length > 30 ? '…' : ''}</em></span>
</div>`
          }).join('')
          // Consumes
          html += ctxConsumeArr.map((v) => {
            presentLabels.add('consume')
            const kwColor = KW_COLORS[v.kind] || '#888'
            return `<div class="g-row" data-labels="consume">
  <span style="color:${kwColor};font-size:11px;min-width:40px">${v.kind}</span>
  <span style="color:var(--text);font-size:11px;min-width:90px">${v.name}</span>
  ${mkBadge('consume')}
  <span class="g-deps">← <em>$context.${v.contextKey}</em></span>
</div>`
          }).join('')
        }

        // ── Watch handlers ─────────────────────────────────────────────────────
        if (watchHandlers.length) {
          html += `<div class="g-section" style="margin-top:10px">$: Watch Handlers</div>`
          html += watchHandlers.map((h) => {
            const tag = h.isAsync ? 'async' : 'sync'
            presentLabels.add(tag)
            const debugChip = h.debugName
              ? `<span class="g-debug">$_${h.debugName}</span>` : ''
            return `<div class="g-row" data-labels="${tag}">
  <span style="font-size:11px;color:var(--orange2)">[${h.deps.join(', ')}]</span>
  ${mkBadge(tag)}${debugChip}
</div>`
          }).join('')
        }

        // ── Watch groups ────────────────────────────────────────────────────────
        const watchGroups = analysis.watchGroups || []
        if (watchGroups.length) {
          html += `<div class="g-section" style="margin-top:10px">$: Watch Groups</div>`
          html += watchGroups.map((g) => {
            const debugChip = g.debugName
              ? `<span class="g-debug">$_${g.debugName}</span>` : ''
            const entrySummary = g.entries.map((e) => {
              const tag = e.isAsync ? 'async' : 'sync'
              presentLabels.add(tag)
              return `<div style="padding-left:14px;padding-top:2px">
  <span style="font-size:11px;color:var(--orange2)">[${e.deps.join(', ')}]</span>
  ${mkBadge(tag)}
</div>`
            }).join('')
            return `<div class="g-row" style="flex-direction:column;align-items:flex-start" data-labels="watch">
  <div>${debugChip || '<span style="color:var(--dim);font-size:11px">group</span>'}</div>
  ${entrySummary}
</div>`
          }).join('')
        }

        // ── Effects ────────────────────────────────────────────────────────────
        if (effects.length) {
          html += `<div class="g-section" style="margin-top:10px">$: Effects</div>`
          html += effects.map((e, i) => {
            presentLabels.add('auto-tracked')
            // Show a snippet of the expression (first 40 chars)
            const snippet = (e.raw || '').trim().replace(/\s+/g, ' ').slice(0, 40)
            const label = e.type === 'block' ? `block #${i + 1}` : `effect #${i + 1}`
            return `<div class="g-row" data-labels="auto-tracked">
  <span style="font-size:11px;color:var(--teal)">${label}</span>
  ${mkBadge('auto-tracked')}
  <span class="g-deps"><em>${snippet}${e.raw?.trim().length > 40 ? '…' : ''}</em></span>
</div>`
          }).join('')
        }

        // ── Path watches ───────────────────────────────────────────────────────
        if (watchPaths.length) {
          html += `<div class="g-section" style="margin-top:10px">$: Path Watches</div>`
          html += watchPaths.map((w) => {
            const tag = w.soft ? 'soft' : 'hard'
            presentLabels.add(tag)
            const debugChip = w.debugName
              ? `<span class="g-debug">$_${w.debugName}</span>` : ''
            return `<div class="g-row" data-labels="${tag}">
  <span style="font-size:11px;color:var(--orange2)">${w.path}</span>
  ${mkBadge(tag)}${debugChip}
</div>`
          }).join('')
        }
