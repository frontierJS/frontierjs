<!-- @frontierjs/css — Invariant 13. Served by `fli project:view` itself, from
     the copy this fli was installed with, so the page needs no network. -->
<link rel="stylesheet" href="/fli.css">

<style>
/*
 * What the vocabulary has no word for.
 *
 * Almost all of it is the diagram: a chain drawn as a grid, which is a picture
 * and not a component. Everything else on the page is a term — Shell, Topbar,
 * Screen, Pane, Card, Tile, Item, Facts, Badge, Pill, Table, Code, Tabs, Alert,
 * Empty, Disclosure.
 *
 * Unlayered, so it beats every layer without !important. No color is written
 * here: a realm carries a tone and the tone carries the color.
 */

[hidden] { display: none; }

/* ─── the chain ──────────────────────────────────────────────────────────── */

/*
 * Five columns and three rows, which is the picture:
 *
 *   ┌ caption ┬ data spine ┬─── the lanes and the realms ───┬ ui spine ┬ caption ┐
 *   │  elbow  │            │      → outgoing lane →         │          │  elbow  │
 *   │  DATA   │  Litestone │  Litestone · Junction · Sierra │ Resource │   UI    │
 *   │  elbow  │  Gate · db │      ← incoming lane ←         │  Store   │  elbow  │
 *
 * A lane spans the realms column only, so a node sits under the realm it
 * belongs to. The elbows in the outer columns are what close the loop: a
 * request arrives at the UI end of the bottom lane, travels left into the data
 * realm, and its result travels back along the top.
 */
.chain {
  display:               grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto auto;
  grid-template-rows:    auto auto auto;
  gap:                   var(--space-md);
  align-items:           stretch;
}

/* The outer columns: a direction caption and the elbow that draws it. */
.rail {
  display:         flex;
  flex-direction:  column;
  align-items:     center;
  justify-content: center;
  gap:             var(--space-2xs);
  text-align:      center;
  text-transform:  uppercase;
  letter-spacing:  var(--label-letter-spacing);
  color:           var(--ink-mute);
}
.rail {
  /*
   * --bg-mix is element-scoped and does not inherit, so an svg inside a toned
   * rail read the fallback and every elbow drew in the Data realm's color.
   * The rail derives it into an ordinary custom property, which does inherit —
   * the same move form-core.css makes to get a tone onto a checkbox.
   */
  --rail-tone: var(--bg-mix, var(--color-primary));
}
.rail svg {
  /* The elbow takes the realm's tone through currentColor, so the loop is
     drawn in the color of the realm it turns through. */
  color:       var(--rail-tone);
  flex-shrink: 0;
  opacity:     0.6;
}

/* A lane is a row of realm bands with the flow drawn between them. */
.lane {
  display:     flex;
  align-items: stretch;
  gap:         var(--space-2xs);
}

/*
 * Consecutive nodes of one realm sit in a tinted band, which is what makes the
 * three realms readable across a lane: the API realm is four nodes wide on the
 * way out and the eye needs to see that as one stretch.
 */
/* Not .band: @frontierjs/css owns that as a full-width page stripe. */
.realm-band {
  display:       flex;
  align-items:   stretch;
  gap:           var(--space-2xs);
  flex:          1 1 0;
  min-inline-size: 0;
  padding:       var(--space-2xs);
  border-radius: var(--card-radius);
  background:    color-mix(in srgb, var(--bg-mix, var(--color-primary)) 8%, transparent);
}
.realm-band > .node-slot { flex: 1 1 0; min-inline-size: 0; }

/*
 * The flow itself: a rule with a head on it. Written in CSS rather than as a
 * glyph so it stretches with the gap and takes the ink color, and drawn with
 * borders so there is no image to load and nothing to theme separately.
 */
.flow {
  position:    relative;
  flex:        0 0 var(--space-2xl);
  align-self:  center;
  block-size:  var(--border-width);
  background:  var(--rule-strong);
}
.flow::after {
  content:     '';
  position:    absolute;
  inset-block-start: 50%;
  translate:   0 -50%;
  border-block: 0.3rem solid transparent;
}
.flow.ltr::after { inset-inline-end:   0; border-inline-start: 0.45rem solid var(--rule-strong); }
.flow.rtl::after { inset-inline-start: 0; border-inline-end:   0.45rem solid var(--rule-strong); }

/* The vertical form, for the two spines. */
.flow.down {
  flex:            0 0 var(--space-lg);
  align-self:      center;
  inline-size:     var(--border-width);
  block-size:      var(--space-lg);
}
.flow.down::after {
  inset-block-start:  auto;
  inset-block-end:    0;
  inset-inline-start: 50%;
  translate:          -50% 0;
  border-block:       0;
  border-inline:      0.3rem solid transparent;
  border-block-start: 0.45rem solid var(--rule-strong);
}

/* The two vertical spines — Data on the left, UI on the right. */
.spine {
  display:        flex;
  flex-direction: column;
  align-items:    stretch;
  gap:            0;
  padding:        var(--space-sm);
  border-radius:  var(--card-radius);
  border:         var(--border-width) solid
                  color-mix(in srgb, var(--bg-mix, var(--color-primary)) 35%, transparent);
  background:     color-mix(in srgb, var(--bg-mix, var(--color-primary)) 7%, transparent);
  inline-size:    9.5rem;
}
.spine-label {
  margin-block-end: var(--space-2xs);
  text-align:       center;
}

/* A node is a Card that is also a control: bounded, clickable, and it says
   which of the three realms it belongs to with a tone. */
.gui-node {
  position:        relative;
  display:         flex;
  flex-direction:  column;
  gap:             var(--space-3xs);
  padding:         var(--space-sm);
  text-align:      start;
  font:            inherit;
  cursor:          pointer;
  overflow-wrap:   anywhere;
  border-radius:   var(--card-radius);
  border:          var(--border-width) solid
                   color-mix(in srgb, var(--bg-mix, var(--color-primary)) 40%, transparent);
  background:      color-mix(in srgb, var(--bg-mix, var(--color-primary)) 10%, var(--surface));
  color:           var(--ink);
  transition:      border-color var(--motion-fast), background var(--motion-fast);
}
.gui-node:hover { border-color: var(--bg-mix, var(--color-primary)); }
.gui-node[aria-pressed="true"] {
  border-color: var(--bg-mix, var(--color-primary));
  background:   color-mix(in srgb, var(--bg-mix, var(--color-primary)) 22%, var(--surface));
}
.gui-node-label { font-weight: 600; }

/*
 * A slot is the node plus whatever joins the chain at it. The node grows to
 * fill the slot so a lane of them stays even.
 */
.node-slot {
  display:        flex;
  flex-direction: column;
  gap:            var(--space-3xs);
}
.node-slot > .gui-node { flex: 1; }

/*
 * A package name is as wide as the package name and a node is as wide as its
 * share of the lane, so `notifications` painted over its neighbor. Truncated
 * rather than wrapped: these are identifiers, and half of one on a second line
 * reads as a different word. The full name is in the title and in the panel
 * the tag opens.
 */
.node-tags {
  display:  flex;
  flex-wrap: wrap;
  gap:      var(--space-3xs);
}
.node-tag {
  max-inline-size: 100%;
  overflow:        hidden;
  text-overflow:   ellipsis;
  display:         block;
  cursor:          pointer;
  border:          var(--border-width) solid
                   color-mix(in srgb, var(--bg-mix, var(--color-primary)) 45%, transparent);
  background:      transparent;
  color:           var(--bg-mix, var(--color-primary));
}
.node-tag:hover,
.node-tag[aria-pressed="true"] {
  background: color-mix(in srgb, var(--bg-mix, var(--color-primary)) 18%, transparent);
}

/* The realm cards sit between the spines and share their height. */
.realms {
  display:               grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap:                   var(--space-md);
}

/*
 * The realm's own tone on its edge. A tinted `.card` alone did not separate the
 * three: --bg-mix does not inherit, so a Card's tone is a property of the Card
 * and every heading inside all three read as the same color.
 */
.realm {
  border-color: color-mix(in srgb, var(--bg-mix, var(--color-primary)) 45%, transparent);
}
.realm > .surface-header {
  border-block-end-color: color-mix(in srgb, var(--bg-mix, var(--color-primary)) 45%, transparent);
}

/* A realm with nothing in it — no resources, no services — is dimmed rather
 * than hidden: which realm an app does NOT use is worth seeing. */
.realm.empty { opacity: 0.55; }

/*
 * Capped, because a realm with 37 models would otherwise set the height of all
 * three. The fade is what says there is more below: the scrollbar is the only
 * other signal and it is hidden on every platform that overlays it.
 */
.realm-nouns {
  max-block-size: 16rem;
  overflow-y:     auto;
  /* The one literal on the page, and it is not a color: a mask reads the
     alpha channel, so the hue is never painted. */
  mask-image:     linear-gradient(to bottom, #000 calc(100% - 1.5rem), transparent);
}

/* ─── the panels ─────────────────────────────────────────────────────────── */

/*
 * The tab strip stays put while a panel scrolls under it. The trailing padding
 * is part of the strip rather than of the panel: without it the first row of a
 * table arrives hard against the strip's rule and reads as clipped.
 */
.panel-tabs {
  position:          sticky;
  inset-block-start: 0;
  z-index:           5;
  background:        var(--app-bg, var(--surface-sunken));
  padding-block-end: var(--space-2xs);
  overflow-x:        auto;
}

/*
 * Chrome leaves a scroll container's bottom padding out of its scrollHeight
 * when the children are flex items, so the last band of a Screen cannot be
 * scrolled to: measured here as a schema list whose final row could not be
 * reached at any scroll position. A trailing item of the same height is in the
 * flow and therefore counted.
 */
.screen::after {
  content:     '';
  block-size:  var(--space-2xl);
  flex-shrink: 0;
}

.detail-slot:empty { display: none; }

/* ─── a machine ──────────────────────────────────────────────────────────── */

/*
 * The second picture on the page. A line's color is its move's tone, set
 * inline from MOVE_TONE so the legend and the board cannot disagree; what is
 * here is the SHAPE of each kind, which is what still reads in a theme whose
 * tones sit close together. Wider than a narrow pane on purpose: the figure
 * scrolls inside itself rather than squeezing the states.
 */
.machine-figure { overflow-x: auto; }
.machine-svg    { display: block; max-inline-size: none; }
.machine-svg text { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; fill: currentColor; }

.mv-line { fill: none; stroke-width: 1.8; }
.mv-line.gated { stroke-dasharray: 7 4; }
.mv-line.app,
.mv-line.timed { stroke-dasharray: 2 4; stroke-linecap: round; stroke-width: 2.2; }

.mv-state rect       { fill: var(--surface-raised, var(--surface)); stroke: var(--ink); stroke-width: 1.5; }
.mv-state rect.ring  { fill: none; stroke-width: 1; }
.mv-state.unreached rect { stroke: var(--ink-mute); stroke-dasharray: 4 4; }
.mv-state-name       { font-weight: 600; font-size: 13px; color: var(--ink); }
.mv-state-sub        { font-size: 10.5px; color: var(--ink-mute); }
.mv-entry            { fill: var(--ink); }

.mv-label            { cursor: pointer; }
.mv-label rect       { fill: var(--surface); stroke: currentColor; stroke-opacity: 0.35; }
.mv-label text       { font-weight: 600; }
.mv-label:hover rect,
.mv-label.on rect    { stroke-opacity: 1; stroke-width: 1.6; }
.mv-label:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.faded               { opacity: 0.25; }

.warden-glyphs { font-family: var(--font-mono, ui-monospace, monospace); letter-spacing: 0.1em; }
</style>
</head>

<div class="shell viewport">

    </div>

      <h2 class="visually-hidden" id="panels-h">Project panels</h2>
    </section>

  </main>
</div>

// A realm is a tone. Three categories, and the three tones that carry no
// status meaning — status is what `success`, `warning` and `danger` say here,
// so a realm cannot borrow one without claiming something.
const REALM_TONE = { data: 'primary', api: 'info', ui: 'secondary' }

let MODEL = null
let selected = null   // { kind: 'node'|'realm'|'noun'|'package', id, nounIdx? }
let panel = 'issues'

const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
const $   = (id) => document.getElementById(id)

// ─── Boot ─────────────────────────────────────────────────────────────────────
async function reload() {
  try {
    const map = await fetch('/data').then(r => r.json())
    MODEL = buildModel(map)
    render()
  } catch (err) {
    $('screen').innerHTML = `<article class="alert danger"><div class="alert-content">
      <strong>Could not read the project map.</strong><p>${esc(err.message)}</p></div></article>`
  }
}

// ─── The model ────────────────────────────────────────────────────────────────
//
// Everything the page draws that is ABOUT THIS PROJECT comes from here, and
// every field of it comes off `/data`. Nothing is invented: a section with no
// source renders as an Empty saying what would fill it.
function buildModel(map) {
  const defs      = map.schema?.$defs ?? {}
  const services  = map.services  ?? []
  const resources = map.resources ?? []
  const surface   = map.surface   ?? null

  // A definition STATES its kind. Filtering on shape (`type === 'object'`) is
  // true of a `type` declaration and a view as well, so eleven payload shapes
  // were listed as models and each warned about a missing `@@gate` it cannot
  // carry (`FJS-1015`). A schema too old to say is treated as no models rather
  // than as every definition — the panel then says the schema needs
  // regenerating, which is true, where the guess said something false.
  const modelEntries = Object.entries(defs).filter(([, d]) => d['x-litestone-kind'] === 'model')
  const enumEntries  = Object.entries(defs).filter(([, d]) => d.type === 'string' && d.enum)

  const models = modelEntries.map(([name, def]) => ({
    name,
    gate:      def['x-gate'] ? gateStr(def['x-gate']) : null,
    softDelete: !!def.properties?.deletedAt,
    version:   def['x-version'] ?? null,
    relations: def['x-relations'] ?? [],
    fields: Object.entries(def.properties ?? {}).map(([fname, prop]) => ({
      name:     fname,
      type:     fieldType(prop),
      nullable: nullable(prop),
      readOnly: !!prop.readOnly,
      required: (def.required ?? []).includes(fname),
    })),
  }))

  const relations = []
  for (const m of models) {
    for (const rel of m.relations) {
      relations.push({
        from:      m.name,
        fromField: rel.fields?.[0] ?? rel.field ?? null,
        to:        rel.model,
        type:      rel.type === 'm2m' ? 'N→N' : 'N→1',
        cascade:   rel.onDelete === 'Cascade',
      })
    }
  }

  // A channel is DECLARED by a service. The old viewer gave every service three
  // invented events; a service that broadcasts nothing now says so.
  const channels = services
    .filter(s => s.channel)
    .map(s => ({
      channel:   s.channel,
      service:   s.name,
      resources: resources.filter(r => r.service === s.name).map(r => r.name),
    }))

  const nouns = {
    litestone: models.map(m => ({ name: m.name, meta: `${m.fields.length} fields`, badge: m.gate })),
    junction:  services.map(s => ({ name: s.name, meta: s.methods.join(' · '), badge: s.channel })),
    sierra:    resources.map(r => ({ name: r.name, meta: r.service ? `→ ${r.service}` : 'no service', badge: null })),
  }

  const packages = (map.packages ?? []).map(p => ({
    ...p,
    ...(REF.TIER1_REGISTRY.find(r => r.id === p.id) ?? {}),
  }))

  return {
    root:       map.meta?.root ?? '',
    name:       (map.meta?.root ?? '').split('/').filter(Boolean).pop() ?? 'project',
    generatedAt: map.meta?.generatedAt ?? null,
    models,
    enums:      enumEntries.map(([name, d]) => ({ name, values: d.enum })),
    services, resources, surface, relations, channels, nouns, packages,
    migrations: map.migrations ?? [],
    env:        map.env ?? null,
    atlas:      map.atlas ?? { skipped: true },
    access:     map.access ?? null,
    machines:   buildMachines(defs, services, map.access),
    issues:     collectIssues({ services, resources, surface, models, env: map.env, packages }),
  }
}

// ─── the three read off a BUILT app ───────────────────────────────────────────
//
// Every panel above is derived from a file. These three cannot be: a job
// registers itself by being autoloaded, a notification takes its type from its
// own file name, and a principal resolver is installed in code. So they come
// from `junction atlas`, and when that could not run they say WHICH of the three
// reasons it was rather than rendering as though the app has none — an app with
// no jobs and an app nobody could boot must not draw the same empty table.

function atlasUnavailable(what) {
  const a = MODEL.atlas ?? {}
  if (a.skipped) return empty(`${what} not read`, 'Started with --no-atlas, so the app was never built. Re-run without it to fill this panel.')
  if (a.error)   return empty(`${what} unavailable`, a.error)
  return null
}

function jobsPanel() {
  const gone = atlasUnavailable('Jobs')
  if (gone) return gone

  const jobs = MODEL.atlas?.jobs
  if (!jobs?.hasQueue) return empty('No queue installed', 'This app configures no app.jobs, so nothing here is durable — a different statement from a queue with no jobs in it.')
  if (!jobs.durable.length && !jobs.timers.length) {
    return empty('A queue, and no handlers', 'Every dispatch this app makes will find nothing to run it.')
  }

  const rows = jobs.durable.map(j => [
    `<code>${esc(j.name)}</code>`,
    j.cron ? `<code>${esc(j.cron)}</code>` : '<span class="text-muted">on dispatch</span>',
    String(j.maxAttempts),
    j.timeout == null ? '<span class="badge warning">none</span>' : `${j.timeout}ms`,
  ])
  const timers = jobs.timers.map(t => [`<code>${esc(t.id)}</code>`, esc(t.type), `<code>${esc(t.expr)}</code>`])

  return `
    <section class="stack gap-sm">
      <h3 class="h6">Durable work — <code>app.jobs</code></h3>
      <p class="text-xs text-muted">A row in the queue database, a retry budget, and the principal that asked for it re-resolved when it runs. Survives a restart.</p>
      ${table(['job', 'schedule', 'attempts', 'timeout'], rows)}
    </section>
    <section class="stack gap-sm">
      <h3 class="h6">In-process timers — <code>app.scheduler</code></h3>
      <p class="text-xs text-muted">No persistence, no retry, no principal; gone with the process, and running in every replica rather than once across them.</p>
      ${timers.length ? table(['id', 'kind', 'declared'], timers) : '<p class="text-sm text-muted">None registered.</p>'}
    </section>`
}

function notificationsPanel() {
  const gone = atlasUnavailable('Notifications')
  if (gone) return gone

  const n = MODEL.atlas?.notifications
  if (!n?.installed) return empty('No notifications plugin', 'This app has no app.notifications, so nothing here can send — a different statement from a plugin configured and finding nothing.')
  if (!n.declared.length) return empty('Configured, and nothing registered', 'Every app.notify this app makes will throw, naming a definition the loader never saw.')

  return `
    <p class="text-xs text-muted">The type is <strong>persisted</strong> — written into <code>notifications.type</code> and read back by the browser to choose a renderer, so a type that moves orphans every row already written under the old string.</p>
    ${table(['type', 'transports'], n.declared.map(d => [
      `<code>${esc(d.type)}</code>`,
      d.transports.length ? d.transports.map(t => `<code>${esc(t)}</code>`).join(' · ') : '<span class="badge warning">none</span>',
    ]))}`
}

function principalPanel() {
  const gone = atlasUnavailable('The principal realm')
  if (gone) return gone

  const p = MODEL.atlas?.principal
  if (!p) return empty('No tenancy, no resolver', 'This app declares no tenancy and installs no principal resolver. That is an answer, not a gap.')

  const t = p.tenancy ?? {}
  const d = p.resolver?.described ?? {}
  const rows = [
    ['tenancy strategy', t.strategy ? `<code>${esc(t.strategy)}</code>` : '<span class="text-muted">none</span>'],
    ['resolved by',      t.resolve  ? esc(t.resolve) : '<span class="text-muted">—</span>'],
    ['resolver',         p.resolver?.name ? `<code>${esc(p.resolver.name)}</code>` : '<span class="text-muted">none installed</span>'],
    ['kind',             d.kind ? esc(d.kind) : '<span class="text-muted">—</span>'],
    ['claims it builds', d.claims?.length ? d.claims.map(c => `<code>${esc(c)}</code>`).join(' · ') : '<span class="text-muted">none</span>'],
    ['named by',         d.namedBy ? esc(d.namedBy) : '<span class="text-muted">—</span>'],
  ]

  return `
    <p class="text-xs text-muted">Who a caller arrives as, and who they become. Read off a built app — a resolver is installed in code and appears in no schema.</p>
    ${table(['', ''], rows)}`
}

function gateStr(g) { return [g.read, g.create, g.update, g.delete].join('.') }
function nullable(prop) { return Array.isArray(prop.type) ? prop.type.includes('null') : false }
function fieldType(prop) {
  if (prop.$ref) return prop.$ref.split('/').pop()
  if (prop['x-litestone-file']) return 'File'
  const t = Array.isArray(prop.type) ? prop.type.filter(x => x !== 'null')[0] : prop.type
  if (t === 'string' && prop.format) return prop.format === 'date-time' ? 'DateTime' : prop.format
  if (t === 'array') return (fieldType(prop.items ?? {})) + '[]'
  return t ?? 'unknown'
}

// ─── Issues ───────────────────────────────────────────────────────────────────
//
// Every row is something READ, and each names where to look. A judgement the
// data cannot support is not made: the old viewer flagged a missing
// `authenticate` hook on every service in the framework, which is a hook this
// framework does not use — `gateAuth` is the derived one and it is always there.
function collectIssues({ services, resources, surface, models, env, packages }) {
  const out = []

  if (!surface) out.push({
    severity: 'error',
    msg:      'No surface.snapshot.md — services, routes and plugins cannot be read',
    ref:      'run `junction surface --app <entry>` at the project root',
  })

  // There is deliberately NO per-service gateAuth check. One lived here and was
  // false for every row it ever printed: it read the per-method `before` chain,
  // and `gateAuth` is an `around.all` hook that `createBaseService` installs
  // unconditionally — zero occurrences in any `before` chain of any snapshot in
  // this repo. So it fired on exactly the services that expose a write method
  // and reported *ungated* about the one thing gated on every path (`FJS-1016`).
  // Where that question HAS a varying answer is the raw routes, which run below
  // the pipeline; the atlas panels are where it is asked.

  for (const m of models) {
    if (!m.gate) out.push({
      severity: 'warning',
      msg:      `Model '${m.name}' declares no @@gate`,
      ref:      'db/schema.lite — an ungated model is reachable at every level',
    })
  }

  for (const v of (env?.vars ?? [])) {
    if (v.required && v.status === 'missing') out.push({
      severity: 'error',
      msg:      `${v.key} is required and not set`,
      ref:      env.file,
      fix:      v.key,
    })
  }

  // *No resource binds to this service* is a fact about coverage, not a defect —
  // a read-side service an API caller uses is correctly bound by nothing — and
  // twenty-four rows of it pushed the real findings off the page. It is a column
  // in the services panel now.

  for (const p of packages) {
    if (!p.installed) out.push({
      severity: 'info',
      msg:      `${p.label} is not installed`,
      ref:      'package.json — the chain points it would occupy are unclaimed',
    })
  }

  return out
}

// ─── Render ───────────────────────────────────────────────────────────────────

  $('app-name').textContent = MODEL.name
  renderEnvBadge()
  renderLive()
  renderChain()
  renderDetail()
  renderPanels()
  paintCode()
}

// ─── Is it actually running? ──────────────────────────────────────────────────
//
// This page is read off FILES, so it draws a complete chain of responsibility
// for an app that is not started and looks identical either way. The surfaces
// and their ports come from the same inventory the fli GUI's dashboard uses,
// and the probe is the same one, so there is one answer to *is it answering*
// rather than two that can disagree.
//
// Polled rather than read once: the interesting moment is the one where
// somebody starts the app in the next window.

const LIVE_POLL_MS = 4000
let liveRows = []

async function renderLive() {
  const el = $('live-badge')
  try {
    const { rows, state } = await fetch('/state').then(r => r.json())
    liveRows = rows.map(r => ({ ...r, state: state[r.id]?.state ?? 'unknown' }))

    const up = liveRows.filter(r => r.state === 'up')
    el.className   = `badge ${up.length ? 'success' : 'muted'}`
    el.textContent = up.length
      ? `${up.map(r => r.name).join(' · ')} up`
      : 'nothing running'
    // The ports are the useful half — a person reading this map is about to go
    // and open one of them.
    el.title = liveRows.map(r => `${r.dir}/${r.name} :${r.port} — ${r.state}`).join('\n')
  } catch {
    // The endpoint is this server's own, so a failure here is this server, not
    // the app. Saying nothing is better than saying the app is down.
    el.className   = 'badge muted'
    el.textContent = 'state unavailable'
  }
}

// One timer for the life of the page. Started here rather than inside
// `renderLive`, which is called on every render and would otherwise stack a
// second poller on each one.
setInterval(renderLive, LIVE_POLL_MS)

function renderEnvBadge() {
  const el   = $('env-badge')
  const miss = MODEL.env?.missingRequired ?? 0
  el.className = `badge ${miss > 0 ? 'danger' : 'success'}`
  el.textContent = miss > 0 ? `env: ${miss} missing` : 'env: ok'
  el.style.cursor = 'pointer'
  el.onclick = () => selectPanel('env')
}

// A node and the packages that join the chain at it. The tags are their own
// controls above the node rather than content inside it: a button cannot nest
// in a button, and a package with nowhere to be clicked is a detail panel
// nothing can reach.
function node(n) {
  const tags = MODEL.packages
    .filter(p => p.installed && (p.chainPoints ?? []).some(c => c.nodeId === n.id))
    .map(p => `
      <button class="pill text-xs node-tag ${REALM_TONE[n.realm]}" title="${esc(p.label)}"
        aria-pressed="${selected?.kind === 'package' && selected.id === p.id}"
        onclick="select('package', '${esc(p.id)}')">${esc(p.short)}</button>`).join('')

  return `
    <div class="node-slot">
      ${tags ? `<div class="node-tags">${tags}</div>` : ''}
      <button class="gui-node ${REALM_TONE[n.realm]}" data-node="${esc(n.id)}"
        aria-pressed="${selected?.kind === 'node' && selected.id === n.id}"
        onclick="select('node', '${esc(n.id)}')">
        <span class="gui-node-label text-sm">${esc(n.label)}</span>
        <span class="text-xs text-muted">${esc(n.sub)}</span>
      </button>
    </div>`
}

// ─── The chain, drawn ─────────────────────────────────────────────────────────
//
// The elbows. Four quarter-turns that close the loop between the two lanes,
// carried over from the page this replaced because the shape is the diagram: a
// request enters at the UI end of the bottom lane, turns at the data end, and
// its result comes back along the top. `currentColor` so each turn takes the
// tone of the realm it happens in.
const ELBOW = {
  'top-left':     { path: 'M6 36 L6 16 Q6 8 14 8 L42 8',  head: '38,4 42,8 38,12' },
  'top-right':    { path: 'M0 8 L28 8 Q36 8 36 16 L36 36', head: '32,32 36,36 40,32' },
  'bottom-left':  { path: 'M42 28 L14 28 Q6 28 6 20 L6 0', head: '2,4 6,0 10,4' },
  // Descends from the UI realm and turns left into the incoming lane. It is
  // where a request STARTS, so the leg has to come down into the corner rather
  // than out of it — drawn the other way up it reads as the lane feeding the
  // browser, which is what the top-right elbow already says.
  'bottom-right': { path: 'M36 0 L36 20 Q36 28 28 28 L0 28',  head: '4,24 0,28 4,32' },
}

const elbow = (corner) => `
  <svg width="42" height="36" viewBox="0 0 42 36" fill="none" aria-hidden="true">
    <path d="${ELBOW[corner].path}" stroke="currentColor" stroke-width="1" fill="none"></path>
    <polygon points="${ELBOW[corner].head}" fill="currentColor"></polygon>
  </svg>`

const flow = (dir) => `<span class="flow ${dir}" aria-hidden="true"></span>`

// Consecutive nodes of one realm are one band. The grouping is what makes a
// lane readable: four API nodes in a row are one stretch of the chain, not four
// unrelated boxes.
function bands(nodes) {
  const out = []
  for (const n of nodes) {
    const last = out[out.length - 1]
    if (last && last.realm === n.realm) last.nodes.push(n)
    else out.push({ realm: n.realm, nodes: [n] })
  }
  return out
}

// `dir` is the reading direction. The incoming lane is reversed in the DOM
// rather than with `row-reverse`, so what a screen reader hears is what the
// page shows and the arrowheads only have to point the other way.
function laneHtml(nodes, dir) {
  const ordered = dir === 'rtl' ? [...nodes].reverse() : nodes
  return bands(ordered)
    .map(b => `<div class="realm-band ${REALM_TONE[b.realm]}">${b.nodes.map(node).join(flow(dir))}</div>`)
    .join(flow(dir))
}

function renderChain() {
  const nodes = REF.CHAIN_DATA.nodes
  const lane  = (which) => nodes.filter(n => n.lane === which)

  const spine = (which, tone, label) => `
    <div class="spine ${tone}">
      <div class="spine-label text-xs text-muted">${esc(label)}</div>
      ${lane(which).map(node).join(flow('down'))}
    </div>`

  $('chain').innerHTML = `
    <div class="rail text-xs ${REALM_TONE.data}" style="grid-area: 1 / 1">
      <span>→ result<br>/ error</span>
      ${elbow('top-left')}
    </div>
    <div class="lane" style="grid-area: 1 / 3">${laneHtml(lane('out'), 'ltr')}</div>
    <div class="rail text-xs ${REALM_TONE.ui}" style="grid-area: 1 / 5">
      <span>ui<br>realm</span>
      ${elbow('top-right')}
    </div>

    <div class="rail text-xs ${REALM_TONE.data}" style="grid-area: 2 / 1"><span>data<br>realm</span></div>
    <div style="grid-area: 2 / 2">${spine('mid', REALM_TONE.data, 'data realm')}</div>
    <div class="realms" style="grid-area: 2 / 3">${REF.CHAIN_DATA.realms.map(realm).join('')}</div>
    <div style="grid-area: 2 / 4">${spine('ui', REALM_TONE.ui, 'ui realm')}</div>
    <div class="rail text-xs ${REALM_TONE.ui}" style="grid-area: 2 / 5"><span>ui<br>realm</span></div>

    <div class="rail text-xs ${REALM_TONE.data}" style="grid-area: 3 / 1">
      ${elbow('bottom-left')}
      <span>← data<br>+ query</span>
    </div>
    <div class="lane" style="grid-area: 3 / 3">${laneHtml(lane('in'), 'rtl')}</div>
    <div class="rail text-xs ${REALM_TONE.ui}" style="grid-area: 3 / 5">
      ${elbow('bottom-right')}
      <span>ui<br>realm</span>
    </div>`
}

function realm(r) {
  const nouns = MODEL.nouns[r.id] ?? []
  const tone  = REALM_TONE[r.realm]
  const on    = (selected?.kind === 'realm' || selected?.kind === 'noun') && selected.id === r.id

  return `
    <article class="card realm ${tone} ${nouns.length ? '' : 'empty'}">
      <div class="surface-header">
        <button class="btn link ${tone}" onclick="select('realm', '${esc(r.id)}')" aria-pressed="${on}">
          <strong>${esc(r.label)}</strong>
        </button>
        <span class="pill">${nouns.length}</span>
      </div>
      <div class="surface-body stack gap-sm">
        <p class="text-xs text-muted">${esc(r.sub)}</p>
        ${nouns.length ? `
          <ul class="items menu realm-nouns">
            ${nouns.map((n, i) => `
              <li>
                <button class="item text-sm" onclick="select('noun', '${esc(r.id)}', ${i})">
                  <span class="item-text">
                    <span class="item-title">${esc(n.name)}</span>
                    <span class="item-sub">${esc(n.meta)}</span>
                  </span>
                  ${n.badge ? `<span class="badge">${esc(n.badge)}</span>` : ''}
                </button>
              </li>`).join('')}
          </ul>`
        : `<div class="empty"><div class="empty-text text-sm">nothing in this realm</div></div>`}
      </div>
    </article>`
}

function select(kind, id, nounIdx) {
  const same = selected?.kind === kind && selected?.id === id && selected?.nounIdx === nounIdx
  selected = same ? null : { kind, id, nounIdx }
  renderChain()
  renderDetail()
  paintCode()
}

// ─── Detail ───────────────────────────────────────────────────────────────────
//
// What a hook point IS comes from the reference; what runs there comes from
// the surface snapshot. The two are drawn apart and labeled, because one is
// true of FrontierJS and the other is true of this project only.
function renderDetail() {
  const slot = $('detail')
  if (!selected) { slot.innerHTML = ''; return }

  const close = `<button class="dialog-close" onclick="select(null)" aria-label="Close">×</button>`

  if (selected.kind === 'node')                     slot.innerHTML = nodeDetail(selected.id, close)
  if (selected.kind === 'realm')                    slot.innerHTML = realmDetail(selected.id, null, close)
  if (selected.kind === 'noun')                     slot.innerHTML = realmDetail(selected.id, selected.nounIdx, close)
  if (selected.kind === 'package')                  slot.innerHTML = packageDetail(selected.id, close)
  slot.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
}

function nodeDetail(id, close) {
  const n   = REF.CHAIN_DATA.nodes.find(x => x.id === id)
  const ref = REF.CHAIN_DATA.hookDetail[id]
  if (!n) return ''

  // The four hook points the snapshot can actually answer for.
  const live = liveHooksFor(id)

  return `
    <article class="card ${REALM_TONE[n.realm]}">
      <div class="surface-header">
        <strong>${esc(ref?.title ?? n.label)}</strong>
        <span class="badge">${esc(n.realm)} realm</span>
        ${close}
      </div>
      <div class="surface-body stack gap-lg">
        ${ref?.desc ? `<p class="text-sm">${esc(ref.desc)}</p>` : ''}

        ${live ? `
          <section class="stack gap-sm">
            <div class="bar">
              <h3 class="h6">What runs here in this project</h3>
              <span class="text-xs text-muted">read from ${esc(MODEL.surface?.file ?? 'the surface snapshot')}</span>
            </div>
            ${live.rows.length ? `
              <div class="table-wrap"><table class="table"><thead>
                <tr><th>${esc(live.head)}</th><th>phase</th><th>chain</th></tr>
              </thead><tbody>
                ${live.rows.map(r => `<tr>
                  <td>${esc(r.owner)}</td><td><code>${esc(r.phase)}</code></td>
                  <td>${r.fns.map(f => `<code>${esc(f)}</code>`).join(' → ')}</td>
                </tr>`).join('')}
              </tbody></table></div>`
            : `<div class="empty"><div class="empty-text text-sm">nothing is registered at this point</div></div>`}
          </section>`
        : ''}

        ${ref?.hooks?.length ? `
          <details class="disclosure">
            <summary class="disclosure-summary text-sm">
              what this point is for
              <span class="badge muted">reference</span>
            </summary>
            <div class="disclosure-body stack gap-sm">
              <p class="text-xs text-muted">Illustrative — describes FrontierJS, not this project.</p>
              <ul class="items">
                ${ref.hooks.map(h => `
                  <li class="item text-sm">
                    <span class="item-lead"><code>${esc(h.phase)}</code></span>
                    <span class="item-text">
                      <span class="item-title">${h.fns.map(f => esc(f)).join(' → ')}</span>
                      <span class="item-sub">${esc(h.svc)}</span>
                    </span>
                  </li>`).join('')}
              </ul>
            </div>
          </details>`
        : ''}

        ${ref?.context ? `<dl class="facts divided"><dt>context</dt><dd><code>${esc(ref.context)}</code></dd></dl>` : ''}
      </div>
    </article>`
}

// The snapshot answers for four of the twenty nodes. Everywhere else the
// honest answer is that nothing here knows, and the panel simply does not
// claim to — rather than showing the reference list as though it were read.
function liveHooksFor(id) {
  const phaseOf = { 'svc-before': 'before', 'svc-after': 'after', 'app-before': 'before', 'app-after': 'after' }
  const phase   = phaseOf[id]
  if (!phase) return null

  if (id.startsWith('app-')) {
    const hooks = MODEL.surface?.appHooks?.[phase] ?? {}
    return {
      head: 'app',
      rows: Object.entries(hooks).map(([m, fns]) => ({ owner: 'app', phase: `${phase}.${m}`, fns })),
    }
  }

  const rows = []
  for (const svc of MODEL.services) {
    for (const [m, fns] of Object.entries(svc.hooks?.[phase] ?? {})) {
      rows.push({ owner: svc.name, phase: `${phase}.${m}`, fns })
    }
  }
  return { head: 'service', rows }
}

function realmDetail(realmId, nounIdx, close) {
  const r = REF.CHAIN_DATA.realms.find(x => x.id === realmId)
  if (!r) return ''
  const tone = REALM_TONE[r.realm]

  if (nounIdx == null) {
    const nouns = MODEL.nouns[realmId] ?? []
    return `
      <article class="card ${tone}">
        <div class="surface-header"><strong>${esc(r.label)}</strong><span class="badge">${esc(r.realm)} realm</span>${close}</div>
        <div class="surface-body stack gap-md">
          <p class="text-sm">${esc(r.sub)}</p>
          <dl class="facts divided">
            <dt>nouns</dt><dd>${nouns.length}</dd>
            <dt>chain points</dt>
            <dd>${REF.CHAIN_DATA.nodes.filter(n => n.realm === r.realm).map(n => `<code>${esc(n.id)}</code>`).join(' · ')}</dd>
          </dl>
        </div>
      </article>`
  }

  // One noun, in full — the model's fields, the service's methods and hooks,
  // or the resource's binding.
  if (realmId === 'litestone') return modelDetail(MODEL.models[nounIdx], tone, close)
  if (realmId === 'junction')  return serviceDetail(MODEL.services[nounIdx], tone, close)
  return resourceDetail(MODEL.resources[nounIdx], tone, close)
}

function serviceDetail(s, tone, close) {

          ${chains.map(c => `<tr><td>${esc(c.p)}</td><td><code>${esc(c.m)}</code></td>

}

function resourceDetail(r, tone, close) {

// ─── Machines and the Warden ──────────────────────────────────────────────────
//
// Two panels about how rows MOVE and who may move them, both read off the
// schema and nothing placed by hand. A machine is one `@@transitions` column
// with the `@@commitments` that fire its moves on a date; the Warden is
// `litestone access` read for one model at one caller level. The tables the
// schema panel already has answer *what is declared*; these answer *what does
// that mean for a row, and for this caller*.

// A move is drawn by who makes it. Status tones are kept for verdicts, so the
// four kinds take the non-status tones plus warning — an @system move is one a
// caller cannot ask for, which is the one a reader is most often surprised by.
const MOVE_TONE = { person: 'primary', gated: 'secondary', app: 'warning', timed: 'info' }
const MOVE_SAYS = {
  person: 'a caller asks for it',
  gated:  'only at a higher level',
  app:    'the app makes it, nobody can ask',
  timed:  'happens on a date',
}

// `services` reports the model as its service named it, which is sometimes the
// accessor (`orders`) rather than the model (`Order`).
function servicesFor(services, name) {
  const lc = name.toLowerCase()
  const spellings = [lc, lc + 's', lc + 'es', lc.replace(/y$/, 'ies')]
  return services.filter(s => s.model === name || spellings.includes(String(s.model ?? '').toLowerCase()))
}

// The first paragraph of a model's `///` note — the schema's own words for it.
function firstParagraph(desc) {
  if (!desc) return ''
  return desc.trim().split(/\n\s*\n| {2,}/)[0].replace(/\*\*|`/g, '').slice(0, 420)
}

function timerWhen(t) {
  const o = t.offset
  return t.on + (!o ? '' : o.field ? ` + ${o.field}` : ` + ${o.value}${o.unit}`)
}

function timerWords(t) {
  const o   = t.offset
  const src = t.owner === t.target ? '' : ` of its ${t.owner}`
  const at  = t.kind === 'day' ? `on the day of ${t.on}${src}` : `at ${t.on}${src}`
  const amt = !o ? '' : o.field ? `${o.field} days` : `${o.value} ${o.unit === 'd' ? 'days' : o.unit}`
  const w   = t.while
  const cond = !w ? ''
    : w.type === 'compare' && w.left?.type === 'field' && w.right?.type === 'literal'
      ? `, while the ${t.owner}'s ${w.left.name} is still ${w.right.value}`
      : ', while a condition holds'
  return (o ? `${amt} after ${t.on}${src}` : at) + cond
}

function buildMachines(defs, services = [], access = null) {
  const timers = []
  for (const [owner, def] of Object.entries(defs))
    for (const [id, c] of Object.entries(def['x-commitments'] ?? {})) timers.push({ id, owner, ...c })

  // `@seals` is in the access reading and not in the JSON Schema's moves.
  const declared = (model, field, move) => (access?.models ?? [])
    .find(m => m.name === model)?.transitions?.find(t => t.field === field && t.name === move) ?? null

  const out = []
  for (const [name, def] of Object.entries(defs)) {
    if (def['x-litestone-kind'] !== 'model' || !def['x-transitions']) continue
    const update = def['x-gate']?.update ?? null
    const svc    = servicesFor(services, name)

    for (const [field, movesByName] of Object.entries(def['x-transitions'])) {
      const prop  = def.properties?.[field] ?? {}
      const ref   = prop.$ref ? defs[prop.$ref.split('/').pop()] : null
      const moves = Object.entries(movesByName).map(([mv, m]) => {
        const timer = timers.find(t => t.target === name && t.field === field && t.transition === mv) ?? null
        const kind  = timer ? 'timed'
          // 8 is asSystem() and nothing else, so a move graded there is the app's
          : m.system || Math.max(update ?? 0, m.gate ?? 0) >= 8 ? 'app'
          : m.gate != null && m.gate > (update ?? 0) ? 'gated'
          : 'person'
        return {
          name: mv, from: m.from.map(String), to: String(m.to),
          gate: m.gate ?? null, system: !!m.system, seals: !!declared(name, field, mv)?.seals,
          kind, timer,
          methods: svc.filter(s => (s.customMethods ?? []).includes(mv)).map(s => `${s.name}.${mv}()`),
        }
      })
      const named  = ref?.enum ?? (prop.type === 'boolean' ? [false, true] : [])
      const states = [...new Set([...named.map(String), ...moves.flatMap(m => [...m.from, m.to])])]
      const froms  = new Set(moves.flatMap(m => m.from))
      const tos    = new Set(moves.map(m => m.to))
      const entry  = prop.default != null ? String(prop.default) : null
      out.push({
        model: name, field, update, states, entry, moves,
        terminal:  states.filter(s => tos.has(s) && !froms.has(s)),
        unreached: states.filter(s => !tos.has(s) && s !== entry),
        note:      firstParagraph(def.description),
        services:  svc.map(s => s.name),
        channel:   svc.find(s => s.channel)?.channel ?? null,
        incoming:  timers.filter(t => t.target === name && t.field === field && t.owner !== name),
        outgoing:  timers.filter(t => t.owner === name && t.target !== name),
      })
    }
  }
  return out
}

// ── the layout ──
//
// Layered, left to right, with no library: the page needs no network, and a
// machine is a handful of states. A state's column is its distance from the
// entry, every final state shares the last column, and each forward move takes
// a slot in every column between its ends — the middle one holds its label —
// so a long move bends around the states it passes instead of through them.
// A move back, or between two states of one column, arcs outside the columns.
const MONO_ADVANCE = 7.2   // px per character at 12px mono; boxes are sized from it

function moveLabel(mv) {
  return mv.name + (mv.kind === 'gated' ? ` · ${mv.gate}+` : '') + (mv.seals ? ' · seals' : '') +
         (mv.timer ? ` · ${timerWhen(mv.timer)}` : '')
}

function layoutMachine(mc) {
  const NODE_H = 40, LABEL_H = 22, GAP_X = 26, GAP_Y = 16, EMPTY_W = 36

  const start = mc.entry ?? mc.states[0]
  const rank  = new Map([[start, 0]])
  for (const queue = [start]; queue.length;) {
    const s = queue.shift()
    for (const m of mc.moves) if (m.from.includes(s) && !rank.has(m.to)) { rank.set(m.to, rank.get(s) + 1); queue.push(m.to) }
  }
  const final = new Set(mc.terminal)
  let last = 0
  for (const [s, r] of rank) if (!final.has(s)) last = Math.max(last, r)
  for (const s of mc.states) {
    if (!rank.has(s)) rank.set(s, 0)
    else if (final.has(s)) rank.set(s, last + 1)
  }

  const cols  = []
  const items = new Map()
  const add   = (c, it) => { (cols[c] ??= []).push(it); items.set(it.id, it); it.col = c; return it }
  for (const s of mc.states)
    add(2 * rank.get(s), { id: 's:' + s, kind: 'state', state: s, w: Math.max(84, s.length * 8 + 32), h: NODE_H, preds: [] })

  const forward = [], back = [], side = []
  for (const mv of mc.moves) {
    const b    = 2 * rank.get(mv.to)
    const text = moveLabel(mv)
    const lw   = text.length * MONO_ADVANCE + 16
    const ahead = []
    for (const f of mv.from) {
      const a = 2 * rank.get(f)
      const e = { mv, from: [f], to: mv.to, key: `${mv.name}:${f}`, text, lw }
      if (b < a) back.push(e)
      else if (b === a) {
        e.label = add(a + 1, { id: `l:${mv.name}:${f}`, kind: 'label', w: lw, h: LABEL_H, preds: ['s:' + f] })
        side.push(e)
      } else ahead.push(f)
    }
    if (!ahead.length) continue
    // Every forward from-state converges on ONE label in the gap before the
    // target, so a move out of three states reads as one move and not three.
    const label = add(b - 1, { id: `l:${mv.name}`, kind: 'label', w: lw, h: LABEL_H, preds: [] })
    const legs  = ahead.map(f => {
      const via = []
      let prev = 's:' + f
      for (let c = 2 * rank.get(f) + 1; c < b - 1; c++) {
        const it = add(c, { id: `d:${mv.name}:${f}:${c}`, kind: 'dummy', w: 0, h: 2, preds: [prev] })
        via.push(it)
        prev = it.id
      }
      label.preds.push(prev)
      return { from: f, via }
    })
    items.get('s:' + mv.to).preds.push(label.id)
    forward.push({ mv, from: ahead, to: mv.to, key: `${mv.name}:${ahead[0]}`, text, lw, label, legs })
  }

  // One barycenter sweep: each item sits near the items that lead into it.
  const pos = (it) => cols[it.col].indexOf(it) - (cols[it.col].length - 1) / 2
  for (let c = 1; c < cols.length; c++) {
    if (!cols[c]) continue
    const bary = new Map(cols[c].map((it, i) => [it, it.preds.length
      ? it.preds.reduce((n, p) => n + pos(items.get(p)), 0) / it.preds.length
      : i - (cols[c].length - 1) / 2]))
    cols[c].sort((x, y) => bary.get(x) - bary.get(y))
  }

  let cursor = 0
  for (let c = 0; c < cols.length; c++) {
    const col   = cols[c] ?? []
    const width = Math.max(c % 2 ? EMPTY_W : 0, ...col.map(it => it.w))
    const total = col.reduce((n, it) => n + it.h, 0) + GAP_Y * Math.max(0, col.length - 1)
    let y = -total / 2
    for (const it of col) { it.cx = cursor + width / 2; it.cy = y + it.h / 2; y += it.h + GAP_Y }
    cursor += width + GAP_X
  }

  const st     = (s) => items.get('s:' + s)
  const states = mc.states.map(s => st(s))
  const top    = Math.min(...[...items.values()].map(it => it.cy - it.h / 2))
  const curve  = (p, q) => {
    const dx = (q[0] - p[0]) / 2
    return p[1] === q[1] ? ` L${q[0]},${q[1]}` : ` C${p[0] + dx},${p[1]} ${q[0] - dx},${q[1]} ${q[0]},${q[1]}`
  }

  const edges = []
  for (const e of forward) {
    const b = st(e.to), lab = e.label
    let d = ''
    for (const leg of e.legs) {
      const a   = st(leg.from)
      const pts = [[a.cx + a.w / 2, a.cy], ...leg.via.map(it => [it.cx, it.cy]), [lab.cx - lab.w / 2, lab.cy]]
      d += `M${pts[0][0]},${pts[0][1]}`
      for (let i = 1; i < pts.length; i++) d += curve(pts[i - 1], pts[i])
    }
    const p = [lab.cx + lab.w / 2, lab.cy], q = [b.cx - b.w / 2 - 2, b.cy]
    edges.push({ ...e, d: d + `M${p[0]},${p[1]}` + curve(p, q), lx: lab.cx, ly: lab.cy })
  }

  // A move within one column leaves its state on the right, turns at its
  // label in the gap column, and comes back into the target's right edge.
  for (const e of side) {
    const a = st(e.from[0]), b = st(e.to), lab = e.label
    const self = e.from[0] === e.to ? 8 : 0
    const p = [a.cx + a.w / 2, a.cy - self], m = [lab.cx - lab.w / 2, lab.cy], q = [b.cx + b.w / 2 + 2, b.cy + self]
    edges.push({ ...e, d: `M${p[0]},${p[1]}` + curve(p, m) + curve(m, q), lx: lab.cx, ly: lab.cy })
  }

  // A move backward arcs over the top. A cubic's apex is three quarters of
  // the way to its control points.
  let over = 0
  for (const e of back) {
    const a = st(e.from[0]), b = st(e.to)
    const y0 = a.cy - a.h / 2, y3 = b.cy - b.h / 2
    const apex = top - 20 - 30 * over++
    const ctl  = (apex - 0.125 * (y0 + y3)) / 0.75
    const d = `M${a.cx},${y0} C${a.cx},${ctl} ${b.cx},${ctl} ${b.cx},${y3 - 2}`
    edges.push({ ...e, d, lx: (a.cx + b.cx) / 2, ly: apex })
  }

  const entry = st(start)
  const placed = [...items.values()]
  const xs = [...placed.map(it => it.cx - it.w / 2), entry.cx - entry.w / 2 - 34, ...edges.map(e => e.lx - e.lw / 2)]
  const xe = [...placed.map(it => it.cx + it.w / 2), ...edges.map(e => e.lx + e.lw / 2)]
  const ys = [...placed.map(it => it.cy - it.h / 2), ...edges.map(e => e.ly - LABEL_H / 2)]
  const ye = [...placed.map(it => it.cy + it.h / 2), ...edges.map(e => e.ly + LABEL_H / 2)]
  const M = 16
  return {
    dx: M - Math.min(...xs), dy: M - Math.min(...ys),
    width:  Math.max(...xe) - Math.min(...xs) + 2 * M,
    height: Math.max(...ye) - Math.min(...ys) + 2 * M,
    labelH: LABEL_H,
    entry:  { x: entry.cx - entry.w / 2, y: entry.cy },
    states: states.map(it => ({
      state: it.state, cx: it.cx, cy: it.cy, w: it.w, h: it.h,
      entry: it.state === mc.entry, final: final.has(it.state), unreached: mc.unreached.includes(it.state),
    })),
    edges,
  }
}

function machineSvg(mc, selected) {
  const L   = layoutMachine(mc)
  const arrows = Object.values(MOVE_TONE).concat('ink').map(t => `
    <marker id="mv-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: ${t === 'ink' ? 'var(--ink)' : `var(--color-${t})`}"/></marker>`).join('')

  const lines = L.edges.map(e => `<path class="mv-line ${e.mv.kind}${selected && selected !== e.mv.name ? ' faded' : ''}"
      d="${e.d}" style="stroke: var(--color-${MOVE_TONE[e.mv.kind]})" marker-end="url(#mv-${MOVE_TONE[e.mv.kind]})"/>`).join('')

  const labels = L.edges.map(e => `
    <g class="mv-label${selected === e.mv.name ? ' on' : ''}${selected && selected !== e.mv.name ? ' faded' : ''}"
       tabindex="0" role="button" data-move="${esc(e.key)}" aria-pressed="${selected === e.mv.name}"
       aria-label="${esc(`${e.mv.name}, from ${e.from.join(' or ')} to ${e.to}: ${MOVE_SAYS[e.mv.kind]}`)}"
       onclick="pickMove('${esc(e.mv.name)}', '${esc(e.key)}')"
       onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); pickMove('${esc(e.mv.name)}', '${esc(e.key)}') }"
       style="color: var(--color-${MOVE_TONE[e.mv.kind]})">
      <rect x="${e.lx - e.lw / 2}" y="${e.ly - L.labelH / 2}" width="${e.lw}" height="${L.labelH}" rx="${L.labelH / 2}"/>
      <text x="${e.lx}" y="${e.ly + 4}" text-anchor="middle">${esc(e.text)}</text>
    </g>`).join('')

  const states = L.states.map(s => {
    const x = s.cx - s.w / 2, y = s.cy - s.h / 2
    const sub = s.entry ? 'starts here' : s.final ? 'final' : s.unreached ? 'nothing moves here' : ''
    return `<g class="mv-state${s.final ? ' final' : ''}${s.unreached ? ' unreached' : ''}">
      ${s.final ? `<rect class="ring" x="${x - 4}" y="${y - 4}" width="${s.w + 8}" height="${s.h + 8}" rx="${(s.h + 8) / 2}"/>` : ''}
      <rect x="${x}" y="${y}" width="${s.w}" height="${s.h}" rx="${s.h / 2}"/>
      <text class="mv-state-name" x="${s.cx}" y="${s.cy + (sub ? 0 : 4)}" text-anchor="middle">${esc(s.state)}</text>
      ${sub ? `<text class="mv-state-sub" x="${s.cx}" y="${s.cy + 13}" text-anchor="middle">${sub}</text>` : ''}
    </g>`
  }).join('')

  const entry = mc.entry == null ? '' : `
    <circle class="mv-entry" cx="${L.entry.x - 28}" cy="${L.entry.y}" r="6"/>
    <path d="M${L.entry.x - 22},${L.entry.y} H${L.entry.x - 3}" style="stroke: var(--ink)" stroke-width="1.5" marker-end="url(#mv-ink)"/>`

  return `<svg class="machine-svg" viewBox="0 0 ${L.width} ${L.height}" width="${L.width}" height="${L.height}" role="group"
      aria-label="${esc(`${mc.model}.${mc.field}: states ${mc.states.join(', ')}`)}">
    <defs>${arrows}</defs>
    <g transform="translate(${L.dx},${L.dy})">${lines}${entry}${states}${labels}</g>
  </svg>`
}

function levelName(n) {
  const levels = MODEL.access?.levels
  const hit = levels && Object.entries(levels).find(([, v]) => v === n)
  return hit ? hit[0] : (REF.TRUST[n] ?? `level ${n}`)
}
const levelWord = (n) => `${levelName(n)} (${n})`

  const legend = `<div class="cluster gap-md text-xs text-muted">

const article = (noun) => /^[aeiou]/i.test(noun) ? 'an' : 'a'

function moveDetail(mc, mv) {

  const who = {

    gated:  `Only ${levelWord(mv.gate)} and above. Everyone else who may edit ${a} is refused this one move.`,
    app:    'Nobody can ask for it. The app makes this move itself, through a system call.',
    timed:  `Nobody can ask for it. It happens on its own, ${mv.timer ? timerWords(mv.timer) : ''}.`,
  }[mv.kind]
  const decl = `${mv.name}: ${mv.from.join(' | ')} -> ${mv.to}` + (mv.gate != null ? ` @gate(${mv.gate})` : '') +
               (mv.system ? ' @system' : '') + (mv.seals ? ' @seals' : '')
  return `<article class="card outlined"><div class="stack gap-sm">
    <div class="cluster gap-sm"><span class="badge ${MOVE_TONE[mv.kind]}">${esc(MOVE_SAYS[mv.kind])}</span><strong>${esc(mv.name)}</strong></div>
    <p class="text-sm">Moves ${esc(a)} from ${mv.from.map(f => `<code>${esc(f)}</code>`).join(' or ')} to <code>${esc(mv.to)}</code>. ${esc(who)}</p>
    ${mv.seals ? `<p class="text-sm"><strong>It seals the row.</strong> After this move every <code>@immutable</code> column is frozen for everybody, the app included, and its <code>@sealed</code> children can no longer change.</p>` : ''}
    <dl class="facts">
      <dt>declared</dt><dd><code>${esc(decl)}</code></dd>
      ${mv.timer ? `<dt>timer</dt><dd><code>${esc(mv.timer.id)}</code> on <code>${esc(mv.timer.owner)}</code>: ${esc(timerWhen(mv.timer))}</dd>` : ''}
      <dt>asked by</dt><dd>${mv.methods.length ? mv.methods.map(m => `<code>${esc(m)}</code>`).join(', ') : '<span class="text-muted">no service method of this name</span>'}</dd>
      <dt>announced</dt><dd>${mc.channel ? `on <code>${esc(mc.channel)}</code>, graded per listener` : '<span class="text-muted">no channel</span>'}</dd>
    </dl>

}

// What the board cannot draw, said once rather than drawn as a guess: a job or
// a notification names no move, so a link between them is a match on names.
function machinesGap() {
  const a = MODEL.atlas
  if (!a?.jobs && !a?.notifications) return ''
  const jobs  = [...(a.jobs?.durable ?? []), ...(a.jobs?.timers ?? [])].map(j => j.name)
  const notes = (a.notifications?.declared ?? []).map(n => n.type)
  if (!jobs.length && !notes.length) return ''
  return `<p class="text-xs text-muted">Not on the board: ${jobs.length} job${jobs.length === 1 ? '' : 's'} and
    ${notes.length} notification${notes.length === 1 ? '' : 's'}. Neither declares the move it makes or follows, so the
    link would be a guess from names.</p>`
}

// ── the Warden ──
//
// One model at one caller level, through the layers `docs/warden.md` names.
// Pure, so the verdicts have a test; the panel only lays them out.
const OPS = ['read', 'create', 'update', 'delete']

function wardenAt(m, level) {
  const system = level >= 8
  const ops = Object.fromEntries(OPS.map(op => {
    const need = m.gate?.[op]
    if (need == null) return [op, { ok: true, says: 'open' }]
    if (need === 9)   return [op, { ok: false, says: 'locked' }]
    if (level < need) return [op, { ok: false, says: `needs ${need}` }]
    if (system)       return [op, { ok: true, says: 'every row' }]
    const p = m.policies?.[op]
    return p && (p.allows?.length || p.denies?.length)
      ? [op, { ok: true, filtered: true, says: op === 'create' ? 'checked' : 'some rows' }]
      : [op, { ok: true, says: 'every row' }]
  }))
  // A move's gate is a FLOOR on the update level (`FJS-D511`), and an @system
  // move is the application's alone.
  const moves = (m.transitions ?? []).map(t => {
    const need = Math.max(m.gate?.update ?? 0, t.gate ?? 0)
    const ok   = t.system ? system : level >= need
    return { name: t.name, field: t.field, ok, says: t.system ? 'app only' : `needs ${need}` }
  })
  return { system, ops, moves }
}

let wardenModel = null
let wardenLevel = 4
function pickWardenModel(name) { wardenModel = name; selectPanel('warden') }
function pickWardenLevel(n)    { wardenLevel = n;    selectPanel('warden') }

function wardenPanel() {
  const acc = MODEL.access
  if (!acc) return empty('No access reading', 'Run project:map without --layer to read the Warden off db/schema.lite.')
  if (acc.error) return `<article class="alert warning"><div class="alert-content">
    <strong>The Warden could not be read.</strong><p>${esc(acc.error)}</p></div></article>`

  const models = [...acc.models].sort((a, b) =>
    (!!b.transitions?.length - !!a.transitions?.length) || a.name.localeCompare(b.name))
  const m = models.find(x => x.name === wardenModel) ?? models[0]
  if (!m) return empty('No models', 'litestone access found no model in db/schema.lite.')
  const L = wardenLevel
  const v = wardenAt(m, L)

  const yes   = (t) => `<span class="badge success">${esc(t)}</span>`
  const no    = (t) => `<span class="badge danger">${esc(t)}</span>`
  const some  = (t) => `<span class="badge info">${esc(t)}</span>`
  const quiet = (t) => `<span class="badge muted">${esc(t)}</span>`
  const opBadge = (op) => { const o = v.ops[op]; return !o.ok ? no(`${op} ✕`) : o.filtered ? some(`${op}: ${o.says}`) : yes(`${op}: ${o.says}`) }
  const none  = (t) => `<span class="text-muted">${esc(t)}</span>`

  const pols = Object.entries(m.policies ?? {})
  const tenancy = MODEL.atlas?.principal?.tenancy
  const unknownClaims = acc.claims?.unknown ?? []
  const channel = servicesFor(MODEL.services, m.name).find(s => s.channel)?.channel

  const rows = [
    ['1', 'principal', 'who is asking',
      `A caller at <strong>${esc(levelWord(L))}</strong>.` +
      (tenancy?.strategy ? ` Tenancy is <code>${esc(tenancy.strategy)}</code>${tenancy.resolve ? `, resolved from ${esc(tenancy.resolve)}` : ''}.` : '') +
      (unknownClaims.length ? `<div class="text-xs text-muted">Read by a rule and declared by no resolver: ${unknownClaims.map(c => `<code>${esc(c)}</code>`).join(', ')} — a rule reading one treats it as unknown.</div>` : ''),
      quiet(v.system ? 'system call' : 'signed in')],
    ['2', 'gate', 'what kind of caller',
      m.gate ? `<code>@@gate("${esc(m.gateSource)}")</code>` : none('No gate: open to every caller.'),
      OPS.map(op => { const need = m.gate?.[op]; return need == null || (need !== 9 && L >= need) ? yes(`${op} ✓`) : no(`${op} ✕`) }).join(' ')],
    ['3', 'capability', 'which action',
      m.capabilities ? `<code>${esc(JSON.stringify(m.capabilities))}</code>` : none('None declared; the gate alone decides.'),
      quiet(m.capabilities ? 'declared' : 'none')],
    ['4', 'row policy', 'whose row',
      pols.length ? pols.map(([op, p]) => `<div><strong>${esc(op)}</strong> ${
        p.allows?.length ? `admits ${p.allows.map(a => `<code>${esc(a.expr)}</code>`).join(' or ')}` : ''}${
        p.denies?.length ? ` · refuses ${p.denies.map(a => `<code>${esc(a.expr)}</code>`).join(' or ')}` : ''}</div>`).join('')
        : none('No row policy: whoever passes the gate reaches every row.'),
      v.system ? yes('lifted for system') : OPS.filter(op => v.ops[op].ok).map(opBadge).join(' ') || quiet('nothing reached')],
    ['5', 'field', 'which columns',
      (m.fields ?? []).length ? m.fields.map(f => `<code>${esc(f.name)}</code> <span class="text-xs text-muted">${esc(f.protection ?? '')}${
        f.allows?.length ? ' · ' + f.allows.map(a => `@allow('${a.operations.join("','")}', ${a.expr})`).map(esc).join(' ') : ''}</span>`).join('<br>')
        : none('No column is protected.'),
      (m.fields ?? []).length ? (v.system ? yes('writes @system') : some(`${m.fields.length} held back`)) : quiet('none')],
    ['6', 'validate', 'is it well-formed', none('Field rules and unknown keys — integrity, the same for every caller.'), quiet('everyone')],
    ['7', 'transition', 'is this move allowed',
      v.moves.length ? `${v.moves.map(x => `<code>${esc(x.name)}</code>`).join(' · ')}<div class="text-xs text-muted">${
        v.system ? 'A system call may make any move, but only along the graph: which moves exist is never lifted.'
                 : 'Which moves exist holds for everyone; who may ask is what changes with level.'}</div>`
        : none('No state machine on this model.'),
      v.moves.length ? v.moves.map(x => x.ok ? yes(`${x.name} ✓`) : no(`${x.name} ✕`)).join(' ') : quiet('none')],
    ['8', 'execute', 'SQLite', none('CHECK, unique, foreign keys — never lifted, not for the app either.'), quiet('everyone')],
    ['9', 'announce', 'who hears about it',
      channel ? `Announced on <code>${esc(channel)}</code>; each listener is graded as themselves.` : none('No service channel announces this model.'),
      quiet(channel ? 'per listener' : 'none')],
  ]

  const ladder = `<div class="tablist pills" role="tablist" aria-label="Caller level">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(n => `
    <button class="tab" role="tab" aria-selected="${n === L}" onclick="pickWardenLevel(${n})">${n} <span class="text-xs">${esc(levelName(n))}</span></button>`).join('')}</div>`

  const glyph = (o) => !o.ok ? '·' : o.filtered ? '◐' : '●'
  const reach = models.map(x => {
    const w = wardenAt(x, L)
    const any = OPS.some(op => w.ops[op].ok)
    return `<button class="btn ${x === m ? 'primary' : 'outlined'} text-xs${any ? '' : ' muted'}" onclick="pickWardenModel('${esc(x.name)}')"
      aria-label="${esc(`${x.name}: ${OPS.map(op => `${op} ${w.ops[op].ok ? w.ops[op].says : 'refused'}`).join(', ')}`)}">
      ${esc(x.name)} <span class="warden-glyphs" aria-hidden="true">${OPS.map(op => glyph(w.ops[op])).join('')}</span></button>`
  }).join('')

  return `
    <div class="cluster gap-lg">
      <label class="stack gap-2xs text-sm">model
        <select class="field" onchange="pickWardenModel(this.value)">${models.map(x =>
          `<option value="${esc(x.name)}"${x === m ? ' selected' : ''}>${esc(x.name)}${x.transitions?.length ? ' ⇄' : ''}</option>`).join('')}</select>
      </label>
      <div class="stack gap-2xs text-sm"><span>who is asking</span>${ladder}</div>
    </div>
    ${table(['', 'layer', 'declared on ' + m.name, 'at ' + levelName(L)], rows.map(([n, name, asks, decl, verdict]) => [
      `<strong>${n}</strong>`, `<strong>${esc(name)}</strong><div class="text-xs text-muted">${esc(asks)}</div>`, decl, verdict]))}
    <section class="stack gap-sm">
      <h3 class="h6">What ${esc(levelWord(L))} reaches</h3>
      <p class="text-xs text-muted">Read · create · update · delete for each model: ● every row, ◐ some rows, · refused. Click one to put it through the layers.</p>
      <div class="cluster gap-2xs">${reach}</div>
    </section>`
}

// The tab strip and the views are SIBLINGS inside the Tabs, never a strip and a
// box of views: `.tabs > .view` is a direct-child selector and it carries the
// air between the two.
//
// A View states `display: block` in the components layer, which outranks
// `.stack`'s `display: flex` in the layout layer — so `class="view stack"`
// silently lays out as a block with the gap doing nothing, and every heading
// in a panel sat on the table above it. The Stack goes on a child.
function renderPanels() {
  const tabs = PANELS.map(p => {
    const on = p.id === panel
    return `<button class="tab" role="tab" id="tab-${p.id}" aria-controls="view-${p.id}"
      aria-selected="${on}" tabindex="${on ? 0 : -1}" onclick="selectPanel('${p.id}')">
      ${esc(p.label)}${badgeFor(p.id)}</button>`
  }).join('')

  const views = PANELS.map(p => `
    <article class="view" role="tabpanel" id="view-${p.id}" aria-labelledby="tab-${p.id}" ${p.id === panel ? '' : 'hidden'}>
      <div class="stack gap-2xl">
        ${p.source === 'reference' ? `
          <article class="alert info">
            <div class="alert-icon" aria-hidden="true">ℹ</div>
            <div class="alert-content"><strong>Reference.</strong>
              <p>This describes FrontierJS and is the same for every project — nothing here is read from ${esc(MODEL.root)}.</p></div>
          </article>` : ''}
        ${p.render()}
      </div>
    </article>`).join('')

  $('panels').innerHTML =
    `<h2 class="visually-hidden" id="panels-h">Project panels</h2>
     <div class="tablist panel-tabs" role="tablist" aria-label="Project panels" id="panel-tabs">${tabs}</div>
     ${views}`
}

function badgeFor(id) {
  if (id === 'issues') {
    const errors   = MODEL.issues.filter(i => i.severity === 'error').length
    const warnings = MODEL.issues.filter(i => i.severity === 'warning').length
    if (errors)   return ` <span class="badge danger">${errors}</span>`
    if (warnings) return ` <span class="badge warning">${warnings}</span>`
  }
  if (id === 'env' && MODEL.env?.missingRequired) return ` <span class="badge danger">${MODEL.env.missingRequired}</span>`
  return ''
}

function selectPanel(id) {
  panel = id
  renderPanels()
  paintCode()
  $('tab-' + id)?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
}

const empty = (title, text) => `

const table = (head, rows) => rows.length
  ? `<div class="table-wrap"><table class="table"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
     <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
  : ''

// The one thing on this page that WRITES. It puts a generated value, or an
// empty placeholder, into the project's own .env — so it says which file it
// touched rather than reporting success and leaving you to find out.
async function fixSecret(key, btn) {
  const original = btn.textContent
  btn.textContent = 'working…'
  btn.disabled = true
  try {
    const res = await fetch('/fix/secret', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ key }),
    }).then(r => r.json())

    if (!res.ok) throw new Error(res.error || 'unknown error')
    note(res.generated
      ? `Generated ${key} and wrote it to ${res.file}`
      : `Added ${key}= to ${res.file} — paste your value there`)
    await reload()
  } catch (err) {
    btn.textContent = original
    btn.disabled = false
    note(`Could not fix ${key}: ${err.message}`, true)
  }
}

function note(message, bad = false) {
  const el = document.createElement('article')
  el.className = `toast ${bad ? 'danger' : 'success'}`
  el.setAttribute('role', 'status')
  el.textContent = message
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 7000)
}

// ─── Theme ────────────────────────────────────────────────────────────────────
const THEMES = ['field', 'default', 'dark', 'midnight', 'forest', 'sunset', 'elite', 'basecamp', 'notebook', 'press']
const DEFAULT_THEME = 'field'

function setTheme(name) {
  document.documentElement.className = 'theme-' + name
  localStorage.setItem('fli-theme', name)
  $('theme-select').value = name
}

;(function initTheme() {
  const saved = localStorage.getItem('fli-theme')
  $('theme-select').innerHTML = THEMES.map(t => `<option value="${t}">${t}</option>`).join('')
  setTheme(THEMES.includes(saved) ? saved : DEFAULT_THEME)
})()

// ─── Highlighting ─────────────────────────────────────────────────────────────
// glow marks a token with the ELEMENT that means it and @frontierjs/css themes
// those elements, so nothing here names a color. `prefix: false` because SQL
// and CSS both start lines with characters glow would eat as diff markers.
function paintCode(root = document) {
  if (!window.glow) return
  for (const el of root.querySelectorAll('code[language]:not([data-glowed])')) {
    el.innerHTML = window.glow(el.textContent, { prefix: false, mark: false })
      .replace(/^<code[^>]*>|<\/code>$/g, '')
    el.setAttribute('data-glowed', '')
  }
}
document.addEventListener('glow-ready', () => paintCode())

// Escape closes whatever detail is open, the way it closes everything else here.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selected) select(null)
