[package]
name     = "workbench-desktop"
version  = "0.0.0"
edition  = "2021"
resolver = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The title bar in the app's theme (src/main.rs with_titlebar): a GTK header
# bar replaces the window manager's, and the page sends its colors.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
