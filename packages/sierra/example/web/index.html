<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>Sierra example</title>
<!--
  `app` + a theme go on <body>. The theme is one class on any ancestor —
  swap it for theme-dark / theme-forest / theme-midnight and every component
  below follows, because it is all custom-property inheritance.
-->
<body class="app theme-default">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
