<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A page this app does not own</title>
  <style>
    /* The host page's own CSS, written to be hostile on purpose. A widget that
       is not isolated inherits all of it, and the symptom is a widget that looks
       broken only on somebody else's site. */
    * { box-sizing: content-box; }
    button { background: rgb(255, 0, 0) !important; font-size: 40px !important; }
    label  { display: none !important; }
    .lead-form { border: 0 !important; }
  </style>
</head>
<body>
  <h1>Host page</h1>

  <!-- A button of the host's own. The widget's <style> must not reach it. -->
  <button id="host-button">host button</button>

  <!-- The element form: no init call, no host JavaScript at all. -->
  <mt-counter data-start="5"></mt-counter>

  <!-- A host element the widget CANNOT mount into, deliberately first.
       `attachShadow` throws on an element that already holds a CLOSED root, and
       an unguarded mountAll loop then abandons every element after this one —
       on this run and on every MutationObserver run after it. It is first
       because that is the only position where the blast radius is visible. -->
  <div id="poison" class="mt-counter" data-start="1"></div>
  <script>
    // Inline and not deferred: this has to run before the widget scripts do.
    document.getElementById('poison').attachShadow({ mode: 'closed' })
    // What a merchant would have to see. A guard that swallows the failure is
    // the version nobody can debug, so the report is asserted beside the mount.
    window.__widgetLog = []
    for (const level of ['error', 'warn']) {
      const original = console[level].bind(console)
      console[level] = (...args) => { window.__widgetLog.push(args.map(String).join(' ')); original(...args) }
    }
  </script>

  <!-- The selector form: markup that predates the element, kept working. -->
  <div id="legacy" class="mt-counter" data-start="100"></div>

  <!-- The kit, inside a shadow root. `@frontierjs/css` declares its tokens on
       :root, which matches nothing in a shadow tree — so every var() in the
       styling language resolves empty in the one surface that always has one. -->
  <mt-kit></mt-kit>

  <!-- Somewhere to move a mounted widget to. A host page that reparents a node
       — a tab strip, a sortable list, a framework re-rendering its tree —
       fires disconnectedCallback then connectedCallback. -->
  <div id="elsewhere"></div>

  <!-- The directory-form widget, with a prop. -->
  <mt-lead-form data-pid="ABC-1"></mt-lead-form>

  <div id="late"></div>

  <!-- {{EMBEDS}} is a DIFFERENT ORIGIN, filled in by the drive. That is what a
       host page writes: the widgets are deployed as static files of their own,
       and a same-origin script tag is the one arrangement no customer has. -->
  <script defer src="{{EMBEDS}}/Counter.js"></script>
  <script defer src="{{EMBEDS}}/LeadForm.js"></script>
  <script defer src="{{EMBEDS}}/Kit.js"></script>
  <!-- The same script twice: a tag manager firing again, a page including the
       snippet in two places. Must not produce two widgets in one box. -->
  <script defer src="{{EMBEDS}}/Counter.js"></script>
</body>
</html>
