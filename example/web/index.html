<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>FrontierJS kitchen sink</title>
<!--
  `app` plus a theme class on the body element. The theme is one class on any
  ancestor — swap theme-default for theme-dark / theme-forest / theme-midnight /
  theme-sunset / theme-elite and everything below follows, because it is all
  custom-property inheritance rather than a stylesheet swap.

  Do not write a literal body tag in this comment. Vite injects the built script
  and stylesheet at the first match for it and does not skip comments, so the
  tags landed INSIDE this comment: `bun run build` succeeded, dist/index.html
  looked plausible, and the built page loaded no JavaScript at all. Nothing
  reported it — the dev server was never affected, and the built page's console
  is empty because there is no script to throw.
-->
<body class="app theme-default">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
