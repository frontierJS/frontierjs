<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>FrontierJS Supply Co.</title>
<!--
  The DEV shell, and only the dev shell.

  A built page never uses this file. `target: 'static'` prerenders every route
  declaring `render: static` into its own HTML, wrapped in the `document` block
  from config/sierra.config.js — including the home page, which overwrites
  whatever Vite emits here. Sierra applies that same block to this file, so
  the body class is stated there and only there (FJS-D971).

  Do not write a literal body tag in this comment. Vite injects the built script
  and stylesheet at the first textual match for it and does not skip comments,
  so the tags land INSIDE the comment: the build succeeds, the file looks
  plausible, and the page loads no JavaScript at all.
-->
<body>
  <div id="app"></div>
  <script type="module" src="virtual:sierra"></script>
</body>
